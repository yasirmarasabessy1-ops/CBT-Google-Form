    function removeModalQuestionItem(indexToRemove) {
      syncModalDraftFromDom();
      if (modalDraftQuestions.length <= 1) return;
      modalDraftQuestions.splice(indexToRemove, 1);
      renderModalQuestionsEditorHtml();
    }

    function changeModalQuestionType(qIndex, newType) {
      syncModalDraftFromDom();
      if (!modalDraftQuestions[qIndex]) return;
      modalDraftQuestions[qIndex].type = newType;
      modalDraftQuestions[qIndex] = normalizeQuestionOptionsForLevel(modalDraftQuestions[qIndex], modalDraftLevel);
      renderModalQuestionsEditorHtml();
    }

    function toggleModalComplexKey(qIndex, letter) {
      syncModalDraftFromDom();
      const q = modalDraftQuestions[qIndex];
      if (!q) return;
      const letters = getOptionLettersByLevel(modalDraftLevel);
      let current = Array.isArray(q.correctComplex) ? [...q.correctComplex] : ['A'];
      if (current.includes(letter)) {
        if (current.length > 1) {
          current = current.filter(l => l !== letter);
        }
      } else if (letters.includes(letter)) {
        current.push(letter);
      }
      q.correctComplex = current;
      renderModalQuestionsEditorHtml();
    }

    function setModalTrueFalseKey(qIndex, tfVal) {
      syncModalDraftFromDom();
      if (!modalDraftQuestions[qIndex]) return;
      modalDraftQuestions[qIndex].correctTF = tfVal === 'Salah' ? 'Salah' : 'Benar';
      renderModalQuestionsEditorHtml();
    }

    function addModalMatchingPair(qIndex) {
      syncModalDraftFromDom();
      const q = modalDraftQuestions[qIndex];
      if (!q) return;
      if (!Array.isArray(q.pairs)) q.pairs = [];
      const nextNum = q.pairs.length + 1;
      q.pairs.push({ left: `Pernyataan ${nextNum}`, right: `Pasangan ${nextNum}` });
      renderModalQuestionsEditorHtml();
    }

    function removeModalMatchingPair(qIndex, pairIdx) {
      syncModalDraftFromDom();
      const q = modalDraftQuestions[qIndex];
      if (!q || !Array.isArray(q.pairs) || q.pairs.length <= 2) return;
      q.pairs.splice(pairIdx, 1);
      renderModalQuestionsEditorHtml();
    }

    function addModalQuestionByType(questionType = 'multiple_choice') {
      syncModalDraftFromDom();
      const nextNum = modalDraftQuestions.length + 1;
      const sampleByType = {
        multiple_choice: {
          type: 'multiple_choice',
          question: `Pertanyaan pilihan ganda nomor ${nextNum}...`,
          correct: 'A'
        },
        complex_mc: {
          type: 'complex_mc',
          question: `Pilihlah pernyataan yang benar mengenai materi evaluasi nomor ${nextNum} (Jawaban lebih dari satu)...`,
          correctComplex: ['A', 'B']
        },
        true_false: {
          type: 'true_false',
          question: `Pernyataan nomor ${nextNum}: Mitokondria merupakan organel sel penghasil energi ATP.`,
          correctTF: 'Benar'
        },
        matching: {
          type: 'matching',
          question: `Pasangkan pernyataan di lajur kiri berikut dengan jawaban yang tepat di lajur kanan (Soal #${nextNum}):`,
          pairs: [
            { left: 'Mitokondria', right: 'Respirasi Seluler (ATP)' },
            { left: 'Ribosom', right: 'Sintesis Protein' },
            { left: 'Kloroplas', right: 'Fotosintesis' }
          ]
        },
        short_answer: {
          type: 'short_answer',
          question: `Sebutkan istilah/nama organel yang dimaksud pada soal nomor ${nextNum}...`,
          correctShort: 'Mitokondria'
        },
        essay: {
          type: 'essay',
          question: `Jelaskan secara ringkas mekanisme utama pada permasalahan nomor ${nextNum}!`,
          correctEssay: 'respirasi seluler, energi ATP'
        }
      };
      const rawNewQ = sampleByType[questionType] || sampleByType.multiple_choice;
      modalDraftQuestions.push(normalizeQuestionOptionsForLevel(rawNewQ, modalDraftLevel));
      renderModalQuestionsEditorHtml();
      const container = document.getElementById('modal-questions-editor-list');
      if (container) {
        setTimeout(() => {
          container.scrollTop = container.scrollHeight;
        }, 40);
      }
    }

    function syncModalDraftFromDom() {
      const letters = getOptionLettersByLevel(modalDraftLevel);
      modalDraftQuestions.forEach((q, idx) => {
        const textEl = document.querySelector(`[data-q-text="${idx}"]`);
        const typeEl = document.querySelector(`[data-q-type="${idx}"]`);
        const corrEl = document.querySelector(`[data-q-correct="${idx}"]`);
        const shortEl = document.querySelector(`[data-q-short="${idx}"]`);
        const essayEl = document.querySelector(`[data-q-essay="${idx}"]`);

        if (textEl) q.question = textEl.value;
        if (typeEl) q.type = typeEl.value;
        if (corrEl) q.correct = corrEl.value;
        if (shortEl) q.correctShort = shortEl.value;
        if (essayEl) q.correctEssay = essayEl.value;

        if (q.type === 'multiple_choice' || q.type === 'complex_mc' || !q.type) {
          if (!Array.isArray(q._allOptions)) {
            q._allOptions = Array.isArray(q.options) ? [...q.options] : [];
          }
          q.options = letters.map((_, optIdx) => {
            const optEl = document.querySelector(`[data-q-opt="${idx}-${optIdx}"]`);
            const val = optEl ? optEl.value : (q.options?.[optIdx] || '');
            q._allOptions[optIdx] = val;
            return val;
          });
        }

        if (q.type === 'matching' && Array.isArray(q.pairs)) {
          q.pairs = q.pairs.map((pair, pIdx) => {
            const leftEl = document.querySelector(`[data-q-pair-left="${idx}-${pIdx}"]`);
            const rightEl = document.querySelector(`[data-q-pair-right="${idx}-${pIdx}"]`);
            return {
              left: leftEl ? leftEl.value : (pair.left || ''),
              right: rightEl ? rightEl.value : (pair.right || '')
            };
          });
        }
      });
    }

    function handleModalLevelChange(newLevel) {
      syncModalDraftFromDom();
      modalDraftLevel = String(newLevel || 'SMA').toUpperCase() === 'SMP' ? 'SMP' : 'SMA';
      modalDraftQuestions = modalDraftQuestions.map(q => normalizeQuestionOptionsForLevel(q, modalDraftLevel));
      renderModalQuestionsEditorHtml();
    }

    function handleModalTargetClassChange(selectedClass) {
      const detectedLevel = detectSchoolLevelFromClass(selectedClass);
      if (detectedLevel && detectedLevel !== modalDraftLevel) {
        handleModalLevelChange(detectedLevel);
        showToast(
          detectedLevel === 'SMP'
            ? `Kelas ${selectedClass} terdeteksi jenjang SMP — Opsi disesuaikan menjadi A s/d D.`
            : `Kelas ${selectedClass} terdeteksi jenjang SMA — Opsi disesuaikan menjadi A s/d E.`,
          'info'
        );
      }
    }

    function handleModalQuestionCountChange(newCountVal) {
      syncModalDraftFromDom();
      const targetCount = Math.max(1, Math.min(50, parseInt(newCountVal, 10) || 1));
      const defaults = buildDefaultQuestionsList(targetCount, modalDraftLevel);
      if (targetCount > modalDraftQuestions.length) {
        for (let i = modalDraftQuestions.length; i < targetCount; i++) {
          modalDraftQuestions.push(defaults[i]);
        }
      } else if (targetCount < modalDraftQuestions.length) {
        modalDraftQuestions = modalDraftQuestions.slice(0, targetCount);
      }
      renderModalQuestionsEditorHtml();
    }

    function collectQuestionsFromExamModal() {
      syncModalDraftFromDom();
      return modalDraftQuestions.map((q, i) => {
        const normalized = normalizeQuestionOptionsForLevel(q, modalDraftLevel);
        return {
          ...normalized,
          question: normalized.question || `Pertanyaan nomor ${i + 1}`,
          entryId: q.entryId || null
        };
      });
    }

    // DETEKSI OTOMATIS SAAT LINK GOOGLE FORM DITEMPEL / DIKETIK PADA INPUT URL
    function handleExamUrlInput(urlVal, immediate = false) {
      if (gformAutoReadTimer) clearTimeout(gformAutoReadTimer);
      const trimmed = (urlVal || '').trim();
      if (!trimmed) {
        updateGFormSyncBanner(null, '');
        return;
      }
      const isGoogleFormUrl =
        trimmed.includes('docs.google.com/forms') ||
        trimmed.includes('forms.gle/');

      if (!isGoogleFormUrl) return;
      if (trimmed === lastSyncedGFormUrl && !immediate) return;

      updateGFormSyncBanner('loading', '⏳ Link Google Form terdeteksi — sedang membaca daftar soal secara otomatis...');
      gformAutoReadTimer = setTimeout(() => {
        fetchQuestionsFromGFormLink(true);
      }, immediate ? 50 : 350);
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        return response;
      } finally {
        clearTimeout(timer);
      }
    }

    // MESIN PEMBACA MULTI-PROXY PARALEL (MENDUKUNG DEKODE BASE64 ALLORIGINS, JINA READER, CODETABS, CORSPROXY)
    async function fetchAndParseGoogleFormUrl(rawUrl, schoolLevel = 'SMA') {
      const targetUrl = prepareGoogleFormFetchUrl(rawUrl);
      if (!targetUrl) return null;

      const attemptExtract = async (fetcherFn) => {
        const htmlOrText = await fetcherFn();
        if (!htmlOrText || htmlOrText.length < 80) {
          throw new Error('Empty response');
        }
        const parsed = parseGoogleFormHtmlToQuestions(htmlOrText, schoolLevel);
        if (parsed && (parsed.error === 'RESTRICTED_FORM' || (Array.isArray(parsed.questions) && parsed.questions.length > 0))) {
          return parsed;
        }
        throw new Error('No questions found in response');
      };

      const strategies = [
        // 1. AllOrigins JSON Wrapper + Dekoder Base64 (Sangat andal untuk docs.google.com & forms.gle)
        () => attemptExtract(async () => {
          const r = await fetchWithTimeout(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}&disableCache=true`, {}, 8500);
          if (!r.ok) throw new Error('AllOrigins JSON HTTP error');
          const data = await r.json();
          return decodeProxyContents(data?.contents || '');
        }),
        // 2. CodeTabs Proxy
        () => attemptExtract(async () => {
          const r = await fetchWithTimeout(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`, {}, 8500);
          if (!r.ok) throw new Error('CodeTabs HTTP error');
          return await r.text();
        }),
        // 3. Jina Reader HTML Mode (Mengikuti redirect forms.gle & merender DOM Google Form)
        () => attemptExtract(async () => {
          const r = await fetchWithTimeout(`https://r.jina.ai/${targetUrl}`, {
            headers: { 'X-Return-Format': 'html', 'Accept': 'text/plain' }
          }, 9500);
          if (!r.ok) throw new Error('Jina HTML HTTP error');
          return await r.text();
        }),
        // 4. AllOrigins Raw
        () => attemptExtract(async () => {
          const r = await fetchWithTimeout(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`, {}, 8500);
          if (!r.ok) throw new Error('AllOrigins Raw HTTP error');
          return await r.text();
        }),
        // 5. CorsProxy.io
        () => attemptExtract(async () => {
          const r = await fetchWithTimeout(`https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`, {}, 8500);
          if (!r.ok) throw new Error('CorsProxy HTTP error');
          return await r.text();
        }),
        // 6. Jina Reader Markdown/Text Mode
        () => attemptExtract(async () => {
          const r = await fetchWithTimeout(`https://r.jina.ai/${targetUrl}`, {}, 9500);
          if (!r.ok) throw new Error('Jina Text HTTP error');
          return await r.text();
        })
      ];

      try {
        // Jalankan secara paralel dan ambil hasil pertama yang berhasil membaca daftar soal
        return await Promise.any(strategies.map(fn => fn()));
      } catch (aggregateErr) {
        return null;
      }
    }

    async function fetchQuestionsFromGFormLink(isAutoTrigger = false) {
      const urlInput = document.getElementById('form-exam-url');
      const btn = document.getElementById('btn-fetch-gform');
      if (!urlInput || !urlInput.value.trim()) {
        if (!isAutoTrigger) showToast('Masukkan Link Google Form terlebih dahulu.', 'warning');
        return;
      }

      const rawUrl = urlInput.value.trim();

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i><span>Membaca Soal...</span>`;
        lucide.createIcons();
      }
      updateGFormSyncBanner('loading', '⏳ Sedang mengekstrak pertanyaan dan pilihan ganda dari Google Form...');

      try {
        const parsed = await fetchAndParseGoogleFormUrl(rawUrl, modalDraftLevel);

        if (parsed && parsed.error === 'RESTRICTED_FORM') {
          updateGFormSyncBanner(
            'warning',
            '⚠️ Google Form ini masih terkunci (Wajib Login). Buka Setelan Google Form -> Matikan "Batasi untuk pengguna" / "Kumpulkan email" atau gunakan fitur Tempel Teks Soal Cepat di bawah.'
          );
          if (!isAutoTrigger) {
            showToast('Google Form masih dibatasi login. Pastikan akses formulir terbuka untuk publik.', 'warning');
          }
          return;
        }

        if (parsed && Array.isArray(parsed.questions) && parsed.questions.length > 0) {
          lastSyncedGFormUrl = rawUrl;
          modalDraftQuestions = parsed.questions.map(q => normalizeQuestionOptionsForLevel(q, modalDraftLevel));

          const countEl = document.getElementById('form-exam-total-questions');
          if (countEl) countEl.value = modalDraftQuestions.length;

          const titleEl = document.getElementById('form-exam-title');
          if (titleEl && !titleEl.value.trim() && parsed.title) {
            titleEl.value = parsed.title;
          }

          const subjectEl = document.getElementById('form-exam-subject');
          if (subjectEl && !subjectEl.value.trim() && parsed.subject) {
            subjectEl.value = parsed.subject;
          }

          renderModalQuestionsEditorHtml();
          const optLabel = modalDraftLevel === 'SMP' ? 'Opsi A–D' : 'Opsi A–E';
          updateGFormSyncBanner(
            'success',
            `✅ Berhasil membaca otomatis ${modalDraftQuestions.length} soal (${optLabel}) dari Google Form${parsed.title ? ` "${parsed.title}"` : ''}! Silakan periksa Kunci Jawaban di bawah.`
          );
          showToast(`Berhasil membaca otomatis ${modalDraftQuestions.length} soal (${optLabel}) dari Link Google Form!`, 'success');
        } else {
          renderModalQuestionsEditorHtml();
          updateGFormSyncBanner(
            'warning',
            'ℹ️ Link Google Form tidak mengizinkan pembacaan langsung atau tidak berisi Pilihan Ganda. Anda juga dapat memakai fitur "Tempel Teks Soal Cepat" di bawah.'
          );
          if (!isAutoTrigger) {
            showToast('Pastikan link Google Form dibuka untuk publik dan memiliki soal Pilihan Ganda.', 'warning');
          }
        }
      } catch (err) {
        renderModalQuestionsEditorHtml();
        updateGFormSyncBanner('warning', '⚠️ Gagal menjangkau link Google Form. Periksa kembali tautan atau gunakan Tempel Teks Soal Cepat di bawah.');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="sparkles" class="w-3.5 h-3.5"></i><span>Baca Ulang Soal</span>`;
          lucide.createIcons();
        }
      }
    }

    function importQuestionsFromQuickPaste() {
      const area = document.getElementById('quick-paste-questions-area');
      if (!area || !area.value.trim()) {
        showToast('Tempelkan teks daftar soal terlebih dahulu.', 'warning');
        return;
      }
      const parsed = parsePlainTextOrMarkdownToQuestions(area.value, modalDraftLevel);
      if (parsed && Array.isArray(parsed.questions) && parsed.questions.length > 0) {
        modalDraftQuestions = parsed.questions.map(q => normalizeQuestionOptionsForLevel(q, modalDraftLevel));
        const countEl = document.getElementById('form-exam-total-questions');
        if (countEl) countEl.value = modalDraftQuestions.length;
        renderModalQuestionsEditorHtml();

    // MODAL INPUT / KALKULATOR NILAI OTOMATIS BERDASARKAN JUMLAH SOAL & JAWABAN BENAR/SALAH
    function openScoreModal(sessionId) {
      const sess = state.sessions.find(s => s.id === sessionId);
      if (!sess) return;
      const part = state.participants.find(p => p.id === sess.participant_id) || { full_name: 'Peserta', class_name: '-' };
      const exam = state.exams.find(e => e.id === sess.exam_id) || { title: 'Ujian CBT', max_violations: 3, total_questions: 5 };
      const totalQ = exam.total_questions || 5;
      const currentScore = sess.score ?? 0;
      const estimatedCorrect = Math.round((currentScore / 100) * totalQ);
      const estimatedWrong = Math.max(0, totalQ - estimatedCorrect);
      const integrityScore = calculateIntegrityPercentage(sess.violation_count, exam.max_violations);
      const currentPred = getScorePredicate(currentScore, sess.status);

      openModal(`
        <div class="bg-white rounded-3xl max-w-md w-full p-6 md:p-8 shadow-2xl border border-white/80 max-h-[92vh] overflow-y-auto">

    function recalculateScoreFromQuestions(changedField) {
      const totalEl = document.getElementById('calc-total-questions');
      const correctEl = document.getElementById('calc-correct-answers');
      const wrongEl = document.getElementById('calc-wrong-answers');
      const scoreEl = document.getElementById('form-session-score');
      const notesEl = document.getElementById('form-session-notes');
      const pointBadgeEl = document.getElementById('calc-point-per-question');

      if (!totalEl || !correctEl || !wrongEl || !scoreEl) return;

      const total = Math.max(1, parseInt(totalEl.value, 10) || 1);
      let correct = parseInt(correctEl.value, 10) || 0;
      let wrong = parseInt(wrongEl.value, 10) || 0;

      if (changedField === 'correct') {
        correct = Math.min(total, Math.max(0, correct));
        wrong = Math.max(0, total - correct);
        correctEl.value = correct;
        wrongEl.value = wrong;
      } else if (changedField === 'wrong') {
        wrong = Math.min(total, Math.max(0, wrong));
        correct = Math.max(0, total - wrong);
        wrongEl.value = wrong;
        correctEl.value = correct;
      } else {
        correct = Math.min(total, Math.max(0, correct));
        wrong = Math.max(0, total - correct);
        correctEl.value = correct;
        wrongEl.value = wrong;
      }

      const pointPerQ = Number((100 / total).toFixed(2));
      if (pointBadgeEl) {
        pointBadgeEl.textContent = `Poin/Soal: ${pointPerQ}`;
      }

      const exactScore = calculateExactExamScore(correct, total);
      scoreEl.value = exactScore;

      if (notesEl) {
        notesEl.value = `Benar ${correct} dari ${total} soal (Salah ${wrong} nomor) • Poin/soal: ${pointPerQ}`;
      }

      updateLivePredicatePreview();
    }

    function updateLivePredicatePreview() {
      const scoreEl = document.getElementById('form-session-score');
      const statusEl = document.getElementById('form-session-status');
      const badgeEl = document.getElementById('live-predicate-badge');
      if (!scoreEl || !statusEl || !badgeEl) return;
      const pred = getScorePredicate(scoreEl.value, statusEl.value);
      badgeEl.className = `px-3 py-1 rounded-full font-extrabold text-xs border ${pred.badgeClass}`;
      badgeEl.textContent = pred.label;
    }

    // FUNGSI CETAK & UNDUH PDF RESMI (MENGGUNAKAN HTML2PDF + FALLBACK PRINT WINDOW)
    async function triggerPrintReport(mode = 'pdf') {
      if (state.activeMenu !== 'reports') {
        state.activeMenu = 'reports';
        renderApp();
        await new Promise(r => setTimeout(r, 150));
      }

      const reportEl = document.getElementById('printable-report-sheet');
      if (!reportEl) {
        showToast('Lembar laporan tidak ditemukan.', 'danger');
        return;
      }

      const btnPdf = document.getElementById('btn-generate-pdf');

      const clone = reportEl.cloneNode(true);
      clone.querySelectorAll('.no-print').forEach(el => el.remove());
      clone.classList.add('pdf-exact-a4');

      if (mode === 'print' || typeof window.html2pdf === 'undefined') {
        const printWin = window.open('', '_blank', 'width=1024,height=840');
        if (printWin) {
          printWin.document.write(`
            <!DOCTYPE html>
            <html lang="id">
            <head>
              <meta charset="UTF-8" />
              <title>Laporan Hasil Ujian CBT — ${state.settings.institution_name}</title>
              <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
              <script src="https://cdn.tailwindcss.com"><\/script>
              <style>
                @page { size: A4 portrait; margin: 10mm 12mm; }
                * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
                body { font-family: 'Plus Jakarta Sans', sans-serif; color: #0A2E36; background: #FFFFFF; margin: 0; padding: 0; }
                .pdf-exact-a4 { width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; }
                .overflow-x-auto { overflow: visible !important; }
                .print-table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; font-size: 9.5pt !important; }
                .print-table th, .print-table td { border: 1px solid #94a3b8 !important; padding: 5px 4px !important; word-wrap: break-word !important; overflow-wrap: break-word !important; white-space: normal !important; vertical-align: middle !important; }
                .print-table tr, .pdf-keep-together { page-break-inside: avoid !important; break-inside: avoid !important; }
                .print-badge { display: inline-block !important; padding: 2px 6px !important; font-size: 8pt !important; border-radius: 9999px !important; }
              </style>
            </head>
            <body>
              ${clone.outerHTML}
              <script>
                setTimeout(() => {
                  window.focus();
                  window.print();
                }, 650);
              <\/script>
            </body>
            </html>
          `);
          printWin.document.close();
          showToast('Jendela cetak A4 siap! Pastikan skala cetak "Default / 100%".', 'success');
        } else {
          window.print();
        }
        return;
      }

      try {
        if (btnPdf) {
          btnPdf.disabled = true;
          btnPdf.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin text-[#D9F2A7]"></i><span>Menyusun A4 PDF...</span>`;
          lucide.createIcons();
        }
        showToast('Sedang merender dokumen PDF A4 presisi ber-Kop Instansi...', 'info');

        const tempWrapper = document.createElement('div');
        tempWrapper.style.position = 'fixed';
        tempWrapper.style.left = '0';
        tempWrapper.style.top = '0';
        tempWrapper.style.width = '710px';
        tempWrapper.style.background = '#FFFFFF';
        tempWrapper.style.zIndex = '-9999';
        tempWrapper.style.opacity = '0';
        tempWrapper.style.pointerEvents = 'none';
        tempWrapper.appendChild(clone);
        document.body.appendChild(tempWrapper);

        await new Promise(r => setTimeout(r, 250));

        const dateSlug = new Date().toISOString().slice(0, 10);
        const safeInstName = (state.settings.institution_name || 'AstroCBT').replace(/[^a-zA-Z0-9]/g, '_');
        const filename = `Laporan_Hasil_CBT_${safeInstName}_${dateSlug}.pdf`;

        const opt = {
          margin: [10, 11, 10, 11],
          filename: filename,
          image: { type: 'jpeg', quality: 0.98 },
          pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', '.pdf-keep-together'] },
          html2canvas: {
            scale: 2,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#FFFFFF',
            width: 710,
            windowWidth: 710,
            scrollX: 0,
            scrollY: 0,
            logging: false
          },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true }
        };

        await window.html2pdf().set(opt).from(clone).save();
        document.body.removeChild(tempWrapper);
        showToast('Laporan PDF A4 berhasil diunduh dengan ukuran presisi!', 'success');
      } catch (err) {
        console.error('PDF export error:', err);
        showToast('Membuka dialog cetak alternatif...', 'warning');
        window.print();
      } finally {
        if (btnPdf) {
          btnPdf.disabled = false;
          btnPdf.innerHTML = `<i data-lucide="printer" class="w-4 h-4 text-[#D9F2A7]"></i><span>Cetak Laporan PDF</span>`;
          lucide.createIcons();
        }
      }
    }

    // HELPER TABEL SESI UJIAN
    function renderSessionsTableHtml() {
      const q = state.searchQuery.toLowerCase();
      const rows = state.sessions.filter(s => {
        const part = state.participants.find(p => p.id === s.participant_id);
        const exam = state.exams.find(e => e.id === s.exam_id);
        const text = `${part?.full_name || ''} ${part?.username || ''} ${part?.class_name || ''} ${exam?.title || ''}`.toLowerCase();

      return `
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="text-xs font-bold text-[#0A2E36] border-b border-slate-200/70">

                <th class="py-3 px-3">Nilai & Predikat</th>

            </thead>
            <tbody class="divide-y divide-slate-100 text-xs">
              ${rows.map(s => {
                const part = state.participants.find(p => p.id === s.participant_id) || { full_name: 'Peserta', username: '-', class_name: '-' };
                const exam = state.exams.find(e => e.id === s.exam_id) || { title: 'Ujian CBT', max_violations: 3 };
                const pred = getScorePredicate(s.score ?? 0, s.status);
                const badge =
                  s.status === 'working'
                    ? '<span class="px-3 py-1 rounded-full bg-[#9EDBD3]/60 text-[#0A2E36] font-bold">Sedang Ujian</span>'

                      <div>${part.full_name}</div>

                    <td class="py-3.5 px-3 text-slate-500 font-mono">${part.username}</td>

                    <td class="py-3.5 px-3">
                      <div class="flex items-center gap-1.5">
                        <span class="font-extrabold text-[#0A2E36] text-sm">${s.score ?? 0}</span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${pred.badgeClass}">${pred.grade}</span>
                      </div>
                    </td>
                    <td class="py-3.5 px-3">${badge}</td>

                      <button
                        onclick="window.app.openScoreModal('${s.id}')"
                        class="px-3 py-1 rounded-full bg-[#BFC2F4] text-[#0A2E36] font-bold hover:opacity-85 transition"
                        title="Hitung & Input Nilai Akhir"

                        Nilai

                      <button
                        onclick="window.app.unlockSession('${s.id}')"
                        class="px-3 py-1 rounded-full bg-[#D9F2A7] text-[#0A2E36] font-bold hover:opacity-85 transition"

                `;

    // =========================================================================
    // 6. MENU HASIL & LAPORAN REAL-TIME + CETAK PDF KOP INSTANSI & LOGO
    // =========================================================================
    function renderAdminReportsContent() {
      const uniqueClasses = getAvailableClassNames();
      const q = state.searchQuery.toLowerCase();

      const filteredSessions = state.sessions.filter(sess => {
        const part = state.participants.find(p => p.id === sess.participant_id) || {};
        const exam = state.exams.find(e => e.id === sess.exam_id) || {};

        const matchExam = state.reportFilterExam === 'all' || sess.exam_id === state.reportFilterExam;
        const matchClass = state.reportFilterClass === 'all' || part.class_name === state.reportFilterClass;
        const matchStatus = state.reportFilterStatus === 'all' || sess.status === state.reportFilterStatus;
        const matchQuery = `${part.full_name || ''} ${part.username || ''} ${part.class_name || ''} ${exam.title || ''}`
          .toLowerCase()
          .includes(q);

        return matchExam && matchClass && matchStatus && matchQuery;
      });

      const totalRows = filteredSessions.length;
      const submittedRows = filteredSessions.filter(s => s.status === 'submitted').length;
      const avgScore = totalRows > 0
        ? (filteredSessions.reduce((acc, cur) => acc + (parseFloat(cur.score) || 0), 0) / totalRows).toFixed(1)
        : '0.0';
      const avgPredicate = getScorePredicate(avgScore, 'submitted');
      const avgIntegrity = totalRows > 0
        ? Math.round(
            filteredSessions.reduce((acc, cur) => {
              const ex = state.exams.find(e => e.id === cur.exam_id);
              return acc + calculateIntegrityPercentage(cur.violation_count, ex?.max_violations || 3);
            }, 0) / totalRows
          )
        : 100;

      const selectedExamObj = state.reportFilterExam !== 'all'
        ? state.exams.find(e => e.id === state.reportFilterExam)
        : null;

      const logoSrc = state.settings.institution_logo && state.settings.institution_logo.trim() !== ''
        ? state.settings.institution_logo
        : DEFAULT_INSTITUTION_LOGO;

      const docNumber = `BA-CBT/${new Date().getFullYear()}/${String(new Date().getMonth() + 1).padStart(2, '0')}/${String(totalRows).padStart(3, '0')}`;

      return `

                <span>REAL-TIME REPORT ENGINE</span>
              </div>
              <h2 class="text-lg md:text-xl font-bold text-[#0A2E36]">Hasil Ujian Siswa & Cetak Laporan Resmi (PDF)</h2>

            <div class="flex flex-wrap items-center gap-2.5">
              <button

              >
                <i data-lucide="building-2" class="w-4 h-4"></i>
                <span>Atur Kop & Logo</span>

          <!-- Baris Filter Laporan -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-100">

                <option value="submitted" ${state.reportFilterStatus === 'submitted' ? 'selected' : ''}>Selesai / Submitted</option>
                <option value="working" ${state.reportFilterStatus === 'working' ? 'selected' : ''}>Sedang Mengerjakan</option>
                <option value="locked" ${state.reportFilterStatus === 'locked' ? 'selected' : ''}>Terkunci / Diskualifikasi</option>
              </select>

          </div>

          <!-- 4 Kartu Mini Bento Ringkasan Hasil -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 pt-1">
            <div class="rounded-2xl bg-[#D9F2A7] p-4 text-[#0A2E36]">
              <div class="text-[11px] font-bold opacity-75">Total Peserta Tercatat</div>
              <div class="text-2xl font-extrabold mt-0.5">${totalRows} Siswa</div>
            </div>
            <div class="rounded-2xl bg-[#9EDBD3] p-4 text-[#0A2E36]">
              <div class="text-[11px] font-bold opacity-75">Rata-Rata Nilai & Predikat</div>
              <div class="text-2xl font-extrabold mt-0.5">${avgScore} <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-white/60">(${avgPredicate.grade})</span></div>
            </div>
            <div class="rounded-2xl bg-[#BFC2F4] p-4 text-[#0A2E36]">
              <div class="text-[11px] font-bold opacity-75">Rata-Rata Kejujuran</div>

            <div class="rounded-2xl bg-[#F5B5B5] p-4 text-[#0A2E36]">

            <div class="w-16 h-16 shrink-0 flex items-center justify-center">
              <img

                alt="Logo Instansi"
                onerror="this.src='${DEFAULT_INSTITUTION_LOGO}'"

              />
            </div>

            <div class="flex-1 text-center px-2">
              <div class="text-[10px] md:text-xs font-bold tracking-widest uppercase text-slate-600">

              </div>
              <h1 class="text-lg md:text-2xl font-extrabold tracking-tight uppercase text-[#0A2E36] mt-0.5">

              </h1>
              <p class="text-[10px] md:text-[11px] text-slate-600 mt-0.5 leading-snug">
                ${state.settings.institution_address || 'Jl. Pendidikan Raya No. 45 • Telp: (021) 555-0192 • Email: info@sekolah.sch.id'}
              </p>
            </div>

            <div class="flex flex-col items-end justify-center shrink-0 text-right">
              <div class="px-2.5 py-1 rounded-xl bg-[#EEF7F6] border border-[#0A2E36]/20 text-[9px] font-mono font-bold text-[#0A2E36]">

              </div>
              <span class="text-[9px] text-slate-500 font-semibold mt-1">TA ${state.settings.academic_year}</span>
            </div>
          </div>

          <!-- JUDUL LAPORAN & NOMOR DOKUMEN -->
          <div class="pdf-keep-together text-center my-4">
            <h2 class="text-sm md:text-base font-extrabold uppercase tracking-wide underline decoration-2 underline-offset-4">

    // RUANG UJIAN TERKUNCI (SEMUA UJIAN TAMPIL DENGAN KARTU GOOGLE FORM EMBEDDED MODE + AUTO-GRADING 6 TIPE SOAL)
    function renderLockedExamRoom() {
      const exam = state.activeExamData;
      const session = state.activeExamSession;
      const mins = Math.floor(state.remainingSeconds / 60).toString().padStart(2, '0');
      const secs = (state.remainingSeconds % 60).toString().padStart(2, '0');
      const isLocked = session.status === 'locked';

      const examLevel = getExamSchoolLevel(exam);
      const letters = getOptionLettersByLevel(examLevel);
      const questionsList = getExamQuestionsList(exam);
      const totalQ = questionsList.length;
      const pointPerQ = Number((100 / Math.max(1, totalQ)).toFixed(2));

      // Konfigurasi kunci penilaian multi-tipe soal untuk dievaluasi di dalam lembar ujian
      const gradingSpec = questionsList.map((q, idx) => {
        const qType = q.type || 'multiple_choice';
        return {
          qKey: `q${idx + 1}`,
          type: qType,
          correct: (q.correct || 'A').toUpperCase(),
          correctComplex: Array.isArray(q.correctComplex) && q.correctComplex.length > 0
            ? q.correctComplex.map(c => String(c).toUpperCase())
            : ['A'],
          correctTF: q.correctTF === 'Salah' ? 'Salah' : 'Benar',
          pairs: Array.isArray(q.pairs) ? q.pairs : [],
          correctShort: q.correctShort || '',
          correctEssay: q.correctEssay || ''
        };
      });

      const questionsCardsHtml = questionsList.map((q, idx) => {
        const qNum = idx + 1;
        const qType = q.type || 'multiple_choice';
        const typeLabel = QUESTION_TYPES_META[qType]?.label || 'Pilihan Ganda';

        let answerControlHtml = '';

        if (qType === 'multiple_choice') {
          answerControlHtml = letters.map((letter, optIdx) => {
            const optText = (q.options && q.options[optIdx]) ? q.options[optIdx] : `Pilihan ${letter}`;
            return `
              <label class="opt">
                <input type="radio" name="q${qNum}" value="${letter}" ${optIdx === 0 ? 'required' : ''} />
                <span>${letter}. ${optText}</span>
              </label>
            `;
          }).join('');
        } else if (qType === 'complex_mc') {
          answerControlHtml = `
            <div class="helper-note">☑️ Pilih semua jawaban yang benar (Bisa memilih lebih dari satu opsi)</div>
            ${letters.map((letter, optIdx) => {
              const optText = (q.options && q.options[optIdx]) ? q.options[optIdx] : `Pilihan ${letter}`;
              return `
                <label class="opt">
                  <input type="checkbox" name="q${qNum}" value="${letter}" />
                  <span>${letter}. ${optText}</span>
                </label>
              `;
            }).join('')}
          `;
        } else if (qType === 'true_false') {
          answerControlHtml = `
            <div class="tf-grid">
              <label class="opt">
                <input type="radio" name="q${qNum}" value="Benar" required />
                <span><strong>BENAR</strong> (Pernyataan Sesuai)</span>
              </label>
              <label class="opt">
                <input type="radio" name="q${qNum}" value="Salah" />
                <span><strong>SALAH</strong> (Pernyataan Tidak Sesuai)</span>
              </label>
            </div>
          `;
        } else if (qType === 'matching') {
          const pairs = Array.isArray(q.pairs) && q.pairs.length > 0 ? q.pairs : [];
          // Urutkan opsi kanan secara alfabetis agar tidak selalu sejajar dengan baris kiri
          const rightChoices = [...new Set(pairs.map(p => p.right).filter(Boolean))].sort((a, b) => a.localeCompare(b));
          answerControlHtml = `
            <div class="helper-note">🔗 Pasangkan setiap pernyataan di sebelah kiri dengan pasangan jawaban yang tepat di sebelah kanan:</div>
            <div class="match-list">
              ${pairs.map((pair, pIdx) => `
                <div class="match-row">
                  <div class="match-left">${pIdx + 1}) ${pair.left}</div>
                  <div class="match-arrow">➔</div>
                  <div class="match-right">
                    <select name="q${qNum}_pair_${pIdx}" class="match-select" required>
                      <option value="">-- Pilih Pasangan --</option>
                      ${rightChoices.map(rOpt => `
                        <option value="${rOpt.replace(/"/g, '&quot;')}">${rOpt}</option>
                      `).join('')}
                    </select>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        } else if (qType === 'short_answer') {
          answerControlHtml = `
            <div class="helper-note">✏️ Ketik jawaban singkat dan tepat pada kolom di bawah ini:</div>
            <input
              type="text"
              name="q${qNum}"
              required
              placeholder="Jawaban singkat Anda..."
              class="text-input"
              oninput="window.computeAndSendGrade(false)"
            />
          `;
        } else if (qType === 'essay') {
          answerControlHtml = `
            <div class="helper-note">📝 Uraikan jawaban lengkap Anda pada kolom essay di bawah ini:</div>
            <textarea
              name="q${qNum}"
              rows="4"
              required
              placeholder="Tulis jawaban uraian / essay Anda secara jelas..."
              class="essay-input"
              oninput="window.computeAndSendGrade(false)"
            ></textarea>
          `;
        }

        return `
          <div class="form-card"><div class="card-body">
            <div class="q-header">
              <div>
                <span class="q-type-chip">${typeLabel}</span>
                <div class="q-title">${qNum}. ${q.question} *</div>
              </div>
              <span class="q-points">${pointPerQ} Poin</span>
            </div>
            ${answerControlHtml}
          </div></div>
        `;
      }).join('');

      const previewGFormSrcDoc = `<!DOCTYPE html>
        <html lang="id">
        <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
          <style>
            body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F0F4F8; margin: 0; padding: 24px 16px; color: #1e293b; }
            .form-card { max-width: 680px; margin: 0 auto 16px; background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 2px 8px rgba(10,46,54,0.05); }
            .top-accent { height: 10px; background: #0A2E36; }
            .card-body { padding: 22px 24px; }
            h1 { margin: 0 0 8px; font-size: 20px; color: #0A2E36; }
            p { margin: 0; font-size: 13px; color: #64748b; line-height: 1.5; }
            .q-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 10px; }
            .q-type-chip { display: inline-block; font-size: 10px; font-weight: 800; color: #0A2E36; background: #D9F2A7; padding: 2px 9px; border-radius: 999px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
            .q-title { font-size: 14px; font-weight: 700; color: #0A2E36; line-height: 1.45; }
            .q-points { font-size: 11px; font-weight: 700; color: #0A2E36; background: #EEF7F6; padding: 3px 10px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
            .helper-note { font-size: 11.5px; color: #475569; margin-bottom: 10px; font-weight: 600; }
            .opt { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 8px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
            .opt:hover { background: #EEF7F6; border-color: #0A2E36; }
            .opt input[type="radio"], .opt input[type="checkbox"] { accent-color: #0A2E36; width: 15px; height: 15px; cursor: pointer; }
            .tf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
            .match-list { display: flex; flex-direction: column; gap: 8px; }
            .match-row { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; gap: 8px; padding: 8px 12px; background: #F8FAFC; border: 1px solid #e2e8f0; border-radius: 12px; }
            .match-left { font-size: 12.5px; font-weight: 700; color: #0A2E36; }
            .match-arrow { text-align: center; font-weight: 800; color: #0A2E36; }
            .match-select { width: 100%; padding: 8px 10px; border-radius: 999px; border: 1px solid #cbd5e1; background: #fff; font-family: inherit; font-size: 12px; font-weight: 600; color: #0A2E36; outline: none; }
            .match-select:focus { border-color: #0A2E36; }
            .text-input { width: 100%; box-sizing: border-box; padding: 11px 16px; border-radius: 999px; border: 1px solid #cbd5e1; background: #F8FAFC; font-family: inherit; font-size: 13px; font-weight: 600; color: #0A2E36; outline: none; }
            .text-input:focus { background: #fff; border-color: #0A2E36; }
            .essay-input { width: 100%; box-sizing: border-box; padding: 12px 16px; border-radius: 14px; border: 1px solid #cbd5e1; background: #F8FAFC; font-family: inherit; font-size: 13px; color: #0A2E36; outline: none; resize: vertical; }
            .essay-input:focus { background: #fff; border-color: #0A2E36; }
            .btn-submit { background: #0A2E36; color: #fff; border: none; padding: 12px 28px; border-radius: 999px; font-weight: 700; font-size: 13px; cursor: pointer; transition: opacity 0.2s; }
            .btn-submit:hover { opacity: 0.92; }
            .badge { display: inline-block; background: #D9F2A7; color: #0A2E36; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
            .score-pill { display: inline-block; background: #0A2E36; color: #D9F2A7; font-size: 18px; font-weight: 800; padding: 8px 20px; border-radius: 999px; margin-top: 12px; }
            @media (max-width: 600px) {
              .tf-grid, .match-row { grid-template-columns: 1fr; }
              .match-arrow { display: none; }
            }
          </style>
        </head>
        <body>
          <div class="form-card">
            <div class="top-accent"></div>
            <div class="card-body">
              <span class="badge">Google Form Embedded Mode • Jenjang ${examLevel} (Opsi A–${letters[letters.length - 1]}) • Kelas: ${exam.target_class || 'SEMUA KELAS'} • ${totalQ} Soal (${pointPerQ} Poin/Soal)</span>
              <h1>${exam.title}</h1>
              <p>Mata Pelajaran: <strong>${exam.subject}</strong> • Peserta: <strong>${state.currentUser.full_name} (${state.currentUser.class_name})</strong></p>
            </div>
          </div>

          <form id="cbt-quiz-form" onchange="window.computeAndSendGrade(false)" onsubmit="event.preventDefault(); window.computeAndSendGrade(true);">
            ${questionsCardsHtml}

            <div style="max-width:680px;margin:0 auto 32px;display:flex;justify-content:space-between;align-items:center;">
              <button type="submit" class="btn-submit">Kirim Jawaban Google Form</button>
              <span style="font-size:12px;color:#64748b;">${totalQ} Soal • Total 100 Poin</span>
            </div>
          </form>

          <div id="done-msg" class="form-card" style="display:none;"><div class="top-accent"></div><div class="card-body">
            <h1>Jawaban Anda telah direkam dan dinilai otomatis.</h1>
            <p id="done-detail" style="margin-top:8px;"></p>
            <div id="done-score" class="score-pill">Nilai: 0</div>
            <p style="margin-top:14px;">Silakan klik tombol <strong>"Selesai Ujian"</strong> di pojok kanan atas layar aplikasi untuk menutup ruang ujian.</p>
          </div></div>

          <script>
            const GRADING_SPEC = ${JSON.stringify(gradingSpec)};
            const TOTAL_QUESTIONS = ${totalQ};
            const POINT_PER_QUESTION = ${pointPerQ};

            window.addEventListener('message', function(ev) {
              if (ev.data && ev.data.type === 'CBT_REQUEST_GRADE_SYNC') {
                window.computeAndSendGrade(false);
              }
            });

            window.computeAndSendGrade = function(isFinalSubmit) {
              const form = document.getElementById('cbt-quiz-form');
              const data = new FormData(form);
              let correctCount = 0;

              GRADING_SPEC.forEach((spec) => {
                const qKey = spec.qKey;
                const qType = spec.type || 'multiple_choice';

                if (qType === 'multiple_choice') {
                  const ans = (data.get(qKey) || '').toString().trim().toUpperCase();
                  if (ans && ans === spec.correct) {
                    correctCount++;
                  }
                } else if (qType === 'complex_mc') {
                  const selected = data.getAll(qKey).map(v => String(v).trim().toUpperCase()).sort();
                  const expected = (spec.correctComplex || []).map(v => String(v).trim().toUpperCase()).sort();
                  if (
                    selected.length > 0 &&
                    selected.length === expected.length &&
                    selected.every((val, i) => val === expected[i])
                  ) {
                    correctCount++;
                  }
                } else if (qType === 'true_false') {
                  const ans = (data.get(qKey) || '').toString().trim().toLowerCase();
                  const exp = (spec.correctTF || 'Benar').toString().trim().toLowerCase();
                  if (ans && ans === exp) {
                    correctCount++;
                  }
                } else if (qType === 'matching') {
                  const pairs = Array.isArray(spec.pairs) ? spec.pairs : [];
                  if (pairs.length > 0) {
                    const allMatched = pairs.every((p, pIdx) => {
                      const chosen = (data.get(qKey + '_pair_' + pIdx) || '').toString().trim().toLowerCase();
                      const target = (p.right || '').toString().trim().toLowerCase();
                      return chosen && chosen === target;
                    });
                    if (allMatched) {
                      correctCount++;
                    }
                  }
                } else if (qType === 'short_answer') {
                  const userAns = (data.get(qKey) || '').toString().trim().toLowerCase();
                  const acceptedList = (spec.correctShort || '')
                    .split(/[,\/|]/)
                    .map(s => s.trim().toLowerCase())
                    .filter(Boolean);
                  if (userAns && (acceptedList.length === 0 || acceptedList.includes(userAns))) {
                    correctCount++;
                  }
                } else if (qType === 'essay') {
                  const essayAns = (data.get(qKey) || '').toString().trim().toLowerCase();
                  const keywords = (spec.correctEssay || '')
                    .split(/[,\/|]/)
                    .map(s => s.trim().toLowerCase())
                    .filter(Boolean);
                  if (essayAns.length >= 3) {
                    if (keywords.length === 0 || keywords.some(kw => essayAns.includes(kw))) {
                      correctCount++;
                    }
                  }
                }
              });

              const wrongCount = Math.max(0, TOTAL_QUESTIONS - correctCount);
              const rawScore = (correctCount / Math.max(1, TOTAL_QUESTIONS)) * 100;
              const exactScore = Number.isInteger(rawScore) ? rawScore : parseFloat(rawScore.toFixed(2));
              const notes = 'Benar ' + correctCount + ' dari ' + TOTAL_QUESTIONS + ' soal (Salah ' + wrongCount + ' nomor) • Poin/soal: ' + POINT_PER_QUESTION;

              window.parent.postMessage({
                type: 'CBT_GFORM_SCORE_UPDATE',
                correctCount: correctCount,
                totalQuestions: TOTAL_QUESTIONS,
                wrongCount: wrongCount,
                score: exactScore,
                isFinalSubmit: !!isFinalSubmit
              }, '*');

              if (isFinalSubmit) {
                form.style.display = 'none';
                const doneMsg = document.getElementById('done-msg');
                const doneDetail = document.getElementById('done-detail');
                const doneScore = document.getElementById('done-score');
                if (doneDetail) {
                  doneDetail.innerHTML = 'Hasil Koreksi Otomatis: <strong>Benar ' + correctCount + ' soal</strong> dan <strong>Salah ' + wrongCount + ' soal</strong> dari total ' + TOTAL_QUESTIONS + ' soal (' + POINT_PER_QUESTION + ' poin per soal).';
                }
                if (doneScore) {
                  doneScore.textContent = 'Nilai Akhir: ' + exactScore + ' / 100';
                }
                if (doneMsg) {
                  doneMsg.style.display = 'block';
                }
              }

              return { score: exactScore, notes: notes };
            };
          <\/script>
        </body>
        </html>`;

      return `
        <div class="w-full h-full flex flex-col bg-[#0A2E36] text-white overflow-hidden relative">
          <!-- Top Security Bar Ruang Ujian -->
          <header class="px-4 md:px-6 py-3 bg-[#0A2E36] border-b border-white/10 flex flex-wrap items-center justify-between gap-3 shrink-0 z-30">

                <i data-lucide="shield-check" class="w-4 h-4"></i>
              </span>
              <div>
                <div class="flex items-center gap-2">
                  <h2 class="text-sm font-bold leading-tight">${exam.title}</h2>
                  <span class="hidden md:inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-[#D9F2A7]/20 text-[#D9F2A7] text-[10px] font-bold">
                    <i data-lucide="maximize-2" class="w-2.5 h-2.5"></i>
                    Layar Penuh Aktif
                  </span>
                </div>
                <p class="text-[11px] text-[#9EDBD3]">${state.currentUser.full_name} (${state.currentUser.username} • ${state.currentUser.class_name})</p>
              </div>
            </div>

            <div class="flex items-center gap-2.5">
              <div class="px-3.5 py-1.5 rounded-full text-xs font-extrabold flex items-center gap-1.5 ${
                session.violation_count > 0 ? 'bg-[#F5B5B5] text-red-950 animate-pulse' : 'bg-white/10 text-white'
              }">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                <span>Pelanggaran: ${session.violation_count} / ${exam.max_violations}</span>
              </div>

              <div class="px-4 py-1.5 rounded-full bg-[#D9F2A7] text-[#0A2E36] text-xs font-extrabold font-mono flex items-center gap-1.5">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                <span id="exam-live-timer">${mins}:${secs}</span>
              </div>

              <button
                onclick="window.app.enterExamFullscreen()"
                title="Perbesar Layar Penuh"
                class="px-3 py-1.5 rounded-full bg-white/15 hover:bg-white/25 text-[11px] font-semibold transition inline-flex items-center gap-1"
              >
                <i data-lucide="maximize" class="w-3 h-3 text-[#9EDBD3]"></i>
                <span class="hidden sm:inline">Layar Penuh</span>

              <button
                onclick="window.app.recordCheatViolation('Simulasi Uji Coba Pindah Tab / Kecurangan')"
                title="Klik untuk menguji deteksi kecurangan"
                class="px-3 py-1.5 rounded-full bg-white/15 hover:bg-white/25 text-[11px] font-semibold transition hidden lg:inline-flex items-center gap-1"
              >
                <i data-lucide="zap" class="w-3 h-3 text-[#D9F2A7]"></i>
                <span>Uji Trigger Curang</span>

              <button

                Selesai Ujian
              </button>
            </div>
          </header>

          <!-- BODY RUANG UJIAN (GOOGLE FORM IFRAME) -->
          <div class="flex-1 bg-[#EEF7F6] relative overflow-hidden flex flex-col">
            ${
              isLocked
                ? `
              <div class="inset-0 z-40 bg-[#0A2E36]/95 backdrop-blur-xl flex items-center justify-center p-6 text-center h-full">
                <div class="max-w-md w-full bg-white text-[#0A2E36] rounded-3xl p-8 shadow-2xl border-4 border-[#F5B5B5]">
                  <div class="w-16 h-16 rounded-full bg-[#F5B5B5] text-red-950 flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="lock" class="w-8 h-8"></i>
                  </div>
                  <span class="px-3 py-1 rounded-full bg-red-100 text-red-800 text-xs font-extrabold uppercase">Akses Google Form Dikunci</span>
                  <h3 class="text-2xl font-extrabold mt-3">Sesi Ujian Dihentikan!</h3>
                  <p class="text-xs text-slate-600 mt-2 leading-relaxed">

                  </div>
                  <button
                    onclick="window.app.exitLockedRoomToLobby()"

                  >
                    Kembali ke Lobby Peserta
                  </button>

              </div>
            `
                : `

                  <span>🔒 Lembar Soal Google Form Terenkripsi (Kelas: ${exam.target_class || 'SEMUA KELAS'}) — Jangan menutup halaman sebelum menekan tombol Kirim/Submit.</span>

    function exitLockedRoomToLobby() {
      clearInterval(state.timerInterval);
      state.activeExamSession = null;
      state.activeExamData = null;
      state.nativeFullscreenEntered = false;
      const appRoot = document.getElementById('astro-cbt-root');
      if (appRoot) appRoot.classList.remove('exam-fullscreen-mode');
      if (IS_PREVIEW) {
        const previewBanner = document.getElementById('preview-banner');
        if (previewBanner) previewBanner.classList.remove('hidden');
      }
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
      renderApp();
    }

    // =========================================================================
    // RENDER UTAMA APLIKASI
    // =========================================================================
    function renderApp() {
      const viewport = document.getElementById('app-viewport');
      if (!viewport) return;

      if (!state.userRole) {
        viewport.innerHTML = renderLoginView();

        viewport.innerHTML = renderParticipantView();

    // EKSPOR FUNGSI KE WINDOW AGAR DAPAT DIPANGGIL DARI EVENT HTML

      enterExamFullscreen,

      finishExamSession,
      exitLockedRoomToLobby
    };

    // Jalankan Aplikasi
    checkInitialSession();
  </script>
