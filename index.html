  <!-- SCRIPT APLIKASI UTAMA (MODULE) -->
  <script type="module">
    // KONFIGURASI APLIKASI
    const IS_PREVIEW = true; // Ubah menjadi false SAAT DEPLOY agar mode preview & data dummy hilang dan terhubung 100% ke Supabase
    const SUPABASE_URL = "URL_SUPABASE_ANDA";
    const SUPABASE_ANON_KEY = "ANON_KEY_ANDA";
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // Inisialisasi Client Supabase hanya saat IS_PREVIEW = false
    const supabase = !IS_PREVIEW ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // Default Logo SVG Instansi (Data URI agar rapi & tidak pernah broken image saat cetak PDF)
    const DEFAULT_INSTITUTION_LOGO = "data:image/svg+xml;utf8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0A2E36"/>
            <stop offset="100%" stop-color="#123E48"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="56" fill="url(#g)" stroke="#D9F2A7" stroke-width="5"/>
        <circle cx="60" cy="60" r="46" fill="none" stroke="#9EDBD3" stroke-width="1.5" stroke-dasharray="4 3"/>
        <path d="M60 24L88 38V62C88 81 75 94 60 99C45 94 32 81 32 62V38L60 24Z" fill="#D9F2A7"/>
        <path d="M47 61L56 70L75 50" stroke="#0A2E36" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    `);

    // Registrasi Service Worker PWA via Blob (1 File Tunggal)
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', (e) => {});
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }

    // STATE APLIKASI
    const state = {
      userRole: null, // 'admin' | 'participant' | null
      currentUser: null,
      activeMenu: 'dashboard', // 'dashboard' | 'classes' | 'exams' | 'participants' | 'proctoring' | 'reports' | 'settings'
      searchQuery: '',
      filterStatus: 'all',
      participantFilterClass: 'all',
      examFilterClass: 'all',

      // Filter Khusus Menu Hasil & Laporan (Real-time Report)
      reportFilterExam: 'all',
      reportFilterClass: 'all',
      reportFilterStatus: 'all',
      realtimeConnected: false,

      isLoading: false,

      // Data Tabel
      classes: [],
      exams: [],
      participants: [],
      sessions: [],
      violationLogs: [],
      settings: {
        id: 'global-settings',
        institution_header: 'PEMERINTAH PROVINSI • DINAS PENDIDIKAN DAN KEBUDAYAAN',
        institution_name: 'SMA Negeri Unggulan Astro',
        institution_address: 'Jl. Pendidikan Raya No. 45, Gedung Sains Terpadu • Telp: (021) 555-0192 • Email: info@smanastro.sch.id',
        institution_logo: '',
        academic_year: '2026/2027',
        signatory_city: 'Jakarta',
        headmaster_name: 'Dr. H. Hendra Wijaya, M.Pd.',
        headmaster_nip: '19780412 200501 1 004',
        integrity_pact: 'Saya berjanji mengerjakan ujian dengan jujur tanpa membuka tab lain, keluar dari mode layar penuh, atau bekerja sama dengan pihak lain.',
        enable_sound_alarm: true,
        strict_fullscreen: true
      },

      // State Ruang Ujian Peserta (Anti-Curang)
      activeExamSession: null, // Objek sesi ujian yang sedang berlangsung
      activeExamData: null,    // Objek ujian Google Form yang sedang dikerjakan
      remainingSeconds: 0,
      timerInterval: null,
      isFullscreenActive: true,
      nativeFullscreenEntered: false,
      lastViolationTimestamp: 0
    };

    // UTILITAS HITUNG NILAI TEPAT BERDASARKAN JUMLAH SOAL & JAWABAN BENAR
    function calculateExactExamScore(correctCount, totalQuestions) {
      const total = Math.max(1, parseInt(totalQuestions, 10) || 1);
      const correct = Math.min(total, Math.max(0, parseInt(correctCount, 10) || 0));
      const rawScore = (correct / total) * 100;
      return Number.isInteger(rawScore) ? rawScore : parseFloat(rawScore.toFixed(2));
    }

    // HELPER OPSI HURUF BERDASARKAN JENJANG PENDIDIKAN (SMP: A-D, SMA: A-E)
    function getOptionLettersByLevel(schoolLevel = 'SMA') {
      const norm = String(schoolLevel || 'SMA').trim().toUpperCase();
      return norm === 'SMP' ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E'];
    }

    function detectSchoolLevelFromClass(className = '') {
      const clean = String(className || '').trim().toUpperCase();
      if (!clean || clean === 'SEMUA KELAS') return null;
      const clsObj = state.classes.find(c => (c.class_name || '').trim().toUpperCase() === clean);
      const gradeInfo = `${clean} ${clsObj?.grade_level || ''}`.toUpperCase();
      if (/\b(SMP|MTS|VII|VIII|IX)\b/.test(gradeInfo) || /\bKELAS\s*(7|8|9)\b/.test(gradeInfo)) {
        return 'SMP';
      }
      if (/\b(SMA|SMK|MA|X|XI|XII)\b/.test(gradeInfo) || /\bKELAS\s*(10|11|12)\b/.test(gradeInfo)) {
        return 'SMA';
      }
      return null;
    }

    // METADATA JENIS SOAL (6 TIPE SOAL CBT)
    const QUESTION_TYPES_META = {
      multiple_choice: { label: 'Pilihan Ganda', shortLabel: 'PG' },
      complex_mc: { label: 'Pilihan Ganda Kompleks', shortLabel: 'PG Kompleks' },
      true_false: { label: 'Benar / Salah', shortLabel: 'Benar/Salah' },
      matching: { label: 'Menjodohkan', shortLabel: 'Menjodohkan' },
      short_answer: { label: 'Isian Singkat', shortLabel: 'Isian Singkat' },
      essay: { label: 'Essay / Uraian', shortLabel: 'Essay' }
    };

    function normalizeQuestionOptionsForLevel(questionObj, schoolLevel = 'SMA') {
      const letters = getOptionLettersByLevel(schoolLevel);
      const targetCount = letters.length;
      const validTypes = Object.keys(QUESTION_TYPES_META);
      const qType = validTypes.includes(questionObj?.type) ? questionObj.type : 'multiple_choice';

      const existingOpts = Array.isArray(questionObj?.options) ? [...questionObj.options] : [];
      const preservedFive = Array.isArray(questionObj?._allOptions) ? [...questionObj._allOptions] : existingOpts;

      if (existingOpts.length >= 5) {
        questionObj._allOptions = [...existingOpts];
      } else if (!questionObj._allOptions) {
        questionObj._allOptions = [...existingOpts];
      }

      const normalizedOpts = [];
      for (let i = 0; i < targetCount; i++) {
        const val = existingOpts[i] ?? preservedFive[i] ?? `Pilihan ${letters[i]}`;
        normalizedOpts.push(String(val).trim() || `Pilihan ${letters[i]}`);
      }

      // 1. Kunci Pilihan Ganda Tunggal
      let correctLetter = String(questionObj?.correct || 'A').trim().toUpperCase();
      if (!letters.includes(correctLetter)) {
        correctLetter = 'A';
      }

      // 2. Kunci Pilihan Ganda Kompleks (Array huruf A-D / A-E)
      let correctComplex = Array.isArray(questionObj?.correctComplex)
        ? questionObj.correctComplex.map(c => String(c).trim().toUpperCase()).filter(c => letters.includes(c))
        : [];
      if (correctComplex.length === 0) {
        correctComplex = ['A', letters[1] || 'B'];
      }

      // 3. Kunci Benar / Salah
      const rawTF = String(questionObj?.correctTF || 'Benar').trim().toLowerCase();
      const correctTF = (rawTF === 'salah' || rawTF === 'false') ? 'Salah' : 'Benar';

      // 4. Pasangan Menjodohkan
      let pairs = Array.isArray(questionObj?.pairs) && questionObj.pairs.length > 0
        ? questionObj.pairs.map((p, idx) => ({
            left: String(p?.left ?? `Pernyataan ${idx + 1}`).trim(),
            right: String(p?.right ?? `Pasangan ${idx + 1}`).trim()
          }))
        : [
            { left: 'Mitokondria', right: 'Respirasi seluler & penghasil ATP' },
            { left: 'Ribosom', right: 'Tempat sintesis protein' },
            { left: 'Lisosom', right: 'Pencernaan intraseluler' }
          ];

      // 5. Kunci Isian Singkat & Essay
      const correctShort = String(questionObj?.correctShort ?? 'Mitokondria').trim();
      const correctEssay = String(questionObj?.correctEssay ?? 'respirasi seluler, energi ATP').trim();

      return {
        ...questionObj,
        type: qType,
        question: String(questionObj?.question || '').trim(),
        options: normalizedOpts,
        correct: correctLetter,
        correctComplex,
        correctTF,
        pairs,
        correctShort,
        correctEssay,
        _allOptions: preservedFive
      };
    }

    // BANK SOAL DEFAULT & GENERATOR SOAL INTERAKTIF (TAMPILAN KARTU GOOGLE FORM EMBEDDED MODE)
    const DEFAULT_BIOLOGY_QUESTIONS = [
      {
        type: 'multiple_choice',
        question: 'Organel sel yang berperan sebagai tempat berlangsungnya respirasi seluler dan menghasilkan energi ATP adalah...',
        options: ['Retikulum Endoplasma', 'Mitokondria', 'Badan Golgi', 'Ribosom', 'Lisosom'],
        correct: 'B'
      },
      {
        type: 'multiple_choice',
        question: 'Enzim yang berfungsi menggandakan untai DNA pada proses replikasi DNA secara semikonservatif adalah...',
        options: ['RNA Polimerase', 'Helikase', 'DNA Polimerase', 'Ligase', 'Topoisomerase'],
        correct: 'C'
      },
      {
        type: 'multiple_choice',
        question: 'Basa nitrogen pirimidin yang hanya ditemukan pada molekul RNA dan menggantikan Timin adalah...',
        options: ['Urasil', 'Adenin', 'Guanin', 'Sitosin', 'Hipoksantin'],
        correct: 'A'
      },
      {
        type: 'multiple_choice',
        question: 'Tahapan pembelahan mitosis di mana kromosom berjajar tepat di bidang ekuator sel disebut...',
        options: ['Profase', 'Metafase', 'Anafase', 'Telofase', 'Interfase'],
        correct: 'B'
      },
      {
        type: 'multiple_choice',
        question: 'Kodon inisiasi (start codon) universal pada proses translasi sintesis protein adalah...',
        options: ['UAA', 'UAG', 'UGA', 'AUG', 'UUG'],
        correct: 'D'
      }
    ];

    function buildDefaultQuestionsList(count = 5, schoolLevel = 'SMA') {
      const total = Math.max(1, Math.min(100, parseInt(count, 10) || 5));
      const letters = getOptionLettersByLevel(schoolLevel);
      const list = [];
      for (let i = 0; i < total; i++) {
        const base = DEFAULT_BIOLOGY_QUESTIONS[i % DEFAULT_BIOLOGY_QUESTIONS.length];
        list.push(normalizeQuestionOptionsForLevel({
          type: 'multiple_choice',
          question: i < DEFAULT_BIOLOGY_QUESTIONS.length ? base.question : `Pertanyaan evaluasi nomor ${i + 1} sesuai materi ujian yang diujikan...`,
          options: base.options.slice(0, letters.length),
          correct: letters.includes(base.correct) ? base.correct : 'A',
          entryId: null,
          _allOptions: [...base.options]
        }, schoolLevel));
      }
      return list;
    }

    function saveExamQuestionsCache(examId, questionsData, totalQuestions, schoolLevel = 'SMA') {
      try {
        const raw = localStorage.getItem('astro_cbt_questions_cache') || '{}';
        const cache = JSON.parse(raw);
        cache[examId] = {
          school_level: schoolLevel,
          total_questions: totalQuestions || questionsData.length || 5,
          questions_data: questionsData
        };
        localStorage.setItem('astro_cbt_questions_cache', JSON.stringify(cache));
      } catch (e) {
        // Abaikan jika storage penuh
      }
    }

    function getExamSchoolLevel(exam) {
      if (!exam) return 'SMA';
      if (exam.school_level && ['SMP', 'SMA'].includes(String(exam.school_level).toUpperCase())) {
        return String(exam.school_level).toUpperCase();
      }
      try {
        const raw = localStorage.getItem('astro_cbt_questions_cache') || '{}';
        const cache = JSON.parse(raw);
        if (cache[exam.id]?.school_level) {
          return String(cache[exam.id].school_level).toUpperCase();
        }
      } catch (e) {
        // Abaikan
      }
      const detected = detectSchoolLevelFromClass(exam.target_class);
      if (detected) return detected;
      if (Array.isArray(exam.questions_data) && exam.questions_data.length > 0) {
        const firstOptLen = exam.questions_data[0]?.options?.length || 5;
        return firstOptLen <= 4 ? 'SMP' : 'SMA';
      }
      return 'SMA';
    }

    function getExamQuestionsList(exam) {
      const level = getExamSchoolLevel(exam);
      if (!exam) return buildDefaultQuestionsList(5, level);
      if (Array.isArray(exam.questions_data) && exam.questions_data.length > 0) {
        return exam.questions_data.map(q => normalizeQuestionOptionsForLevel(q, level));
      }
      try {
        const raw = localStorage.getItem('astro_cbt_questions_cache') || '{}';
        const cache = JSON.parse(raw);
        if (cache[exam.id] && Array.isArray(cache[exam.id].questions_data) && cache[exam.id].questions_data.length > 0) {
          return cache[exam.id].questions_data.map(q => normalizeQuestionOptionsForLevel(q, level));
        }
      } catch (e) {
        // Abaikan error parse
      }
      return buildDefaultQuestionsList(exam.total_questions || 5, level);
    }

    function isDefaultBiologyQuestions(questions, examTitle = '') {
      if (!Array.isArray(questions) || questions.length === 0) return true;
      if (examTitle && examTitle.toLowerCase().includes('biologi molekuler')) return false;

    // HELPER NORMALISASI URL GOOGLE FORM AGAR DAPAT DIBACA PUBLIK (MENDUKUNG docs.google.com & forms.gle)
    function prepareGoogleFormFetchUrl(rawUrl) {
      if (!rawUrl) return '';
      let url = rawUrl.trim();
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }
      // Jika link pendek forms.gle, biarkan utuh agar redirect ditangani proxy
      if (/^https?:\/\/(www\.)?forms\.gle\//i.test(url)) {
        return url.split('#')[0];
      }
      // Ubah akhiran /edit, /formResponse, atau /prefill pada docs.google.com/forms menjadi /viewform
      url = url.replace(/\/(edit|formResponse|prefill)(\?.*|#.*|$)/i, '/viewform');
      if (url.includes('docs.google.com/forms/d/') && !url.includes('/viewform')) {
        url = url.replace(/\/+$/, '') + '/viewform';
      }
      try {
        const parsedUrl = new URL(url);
        parsedUrl.searchParams.delete('embedded');
        parsedUrl.searchParams.delete('usp');
        parsedUrl.hash = '';
        return parsedUrl.toString();
      } catch (e) {
        return url.replace(/[?&]embedded=true/gi, '');
      }
    }

    // DEKODER BASE64 DATA URI (UNTUK RESPONS PROXY ALLORIGINS YANG TERENKODE BASE64)
    function decodeProxyContents(contents) {
      if (!contents || typeof contents !== 'string') return '';
      if (contents.startsWith('data:') && contents.includes(';base64,')) {
        try {
          const base64Part = contents.split(';base64,')[1].trim();
          const binaryStr = atob(base64Part);
          const bytes = new Uint8Array(binaryStr.length);
          for (let i = 0; i < binaryStr.length; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
          }
          return new TextDecoder('utf-8').decode(bytes);
        } catch (e) {
          return contents;
        }
      }
      return contents;
    }

    // EKSTRAKTOR BALANCED-BRACKET UNTUK VARIABEL FB_PUBLIC_LOAD_DATA_ PADA GOOGLE FORM
    function extractFbPublicLoadData(htmlText) {
      if (!htmlText) return null;
      const marker = 'FB_PUBLIC_LOAD_DATA_';
      const markerIdx = htmlText.indexOf(marker);
      if (markerIdx === -1) return null;

      const startBracket = htmlText.indexOf('[', markerIdx);
      if (startBracket === -1) return null;

      let depth = 0;
      let inString = false;
      let escapeNext = false;
      let endBracket = -1;

      for (let i = startBracket; i < htmlText.length; i++) {
        const ch = htmlText[i];
        if (escapeNext) {
          escapeNext = false;
          continue;
        }
        if (ch === '\\' && inString) {
          escapeNext = true;
          continue;
        }
        if (ch === '"') {
          inString = !inString;
          continue;
        }
        if (!inString) {
          if (ch === '[') {
            depth++;
          } else if (ch === ']') {
            depth--;
            if (depth === 0) {
              endBracket = i;
              break;
            }
          }
        }
      }

      if (endBracket !== -1) {
        try {
          return JSON.parse(htmlText.slice(startBracket, endBracket + 1));
        } catch (e) {
          // Lanjut ke regex fallback
        }
      }

      const regexMatch = htmlText.match(/FB_PUBLIC_LOAD_DATA_\s*=\s*(\[[\s\S]*?\]);\s*<\/script>/);
      if (regexMatch && regexMatch[1]) {
        try {
          return JSON.parse(regexMatch[1]);
        } catch (e) {
          return null;
        }
      }
      return null;
    }

    // PEMBERSIH TEKS SOAL & OPSI AGAR TIDAK DOBEL PENOMORAN (Contoh: "1. 1. Soal" atau "A. A. Opsi")
    function cleanQuestionNumberPrefix(text) {
      if (!text) return '';
      return String(text)
        .replace(/\r?\n+/g, ' ')
        .replace(/^\s*(?:soal\s*)?(?:no(?:mor)?\.?\s*)?\d+\s*[\.\)\-:]\s*/i, '')
        .trim();
    }

    function cleanOptionLetterPrefix(text) {
      if (!text) return '';
      return String(text)
        .replace(/\r?\n+/g, ' ')
        .replace(/^\s*[A-Ea-e]\s*[\.\)\-:]\s*/, '')
        .trim();
    }

    function isIdentityFieldTitle(titleText) {
      if (!titleText) return false;
      const clean = titleText.trim().toLowerCase();
      if (clean.length > 48) return false;
      return /^(pilih\s+|masukkan\s+|isi\s+|ketik\s+)?(nama(\s+lengkap|\s+siswa|\s+peserta|\s+anda)?|kelas(\s*\/\s*rombel|\s+siswa|\s+anda)?|rombel|jurusan|program\s+keahlian|no(\.|mor)?\s*(absen|urut|peserta|ujian|induk)|absen(si)?|nisn?|nis|nip|token(\s+ujian)?|password|kata\s*sandi|kode(\s+soal|\s+ujian)?|email|alamat\s+email|jenis\s+kelamin|tanggal(\s+ujian)?|hari\s*\/?\s*tanggal|waktu|sekolah|asal\s+sekolah|ruang(\s+ujian)?|sesi(\s+ujian)?)(\s*\*|\s*:)?$/i.test(clean);
    }

    // PARSER TEKS / MARKDOWN UNTUK MENGEKSTRAK SOAL PILIHAN GANDA
    function parsePlainTextOrMarkdownToQuestions(rawText, schoolLevel = 'SMA') {
      if (!rawText || typeof rawText !== 'string') return null;
      const lines = rawText
        .split(/\r?\n/)
        .map(l => l.replace(/^\s*[-*•]\s*/, '').replace(/^\s*\(\s*\)\s*/, '').replace(/^\s*\[\s*\]\s*/, '').trim())
        .filter(Boolean);

      const letters = getOptionLettersByLevel(schoolLevel);
      const targetOptCount = letters.length;
      const extracted = [];
      let currentQ = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (/^(Title|URL Source|Markdown Content|Warning|Google Formulir|Google Forms| Wajib|Required|\* Menunjukkan pertanyaan yang wajib diisi|Jangan pernah mengirimkan sandi|Konten ini tidak dibuat|Laporkan Penyalahgunaan|Kirim|Kosongkan formulir)/i.test(line)) {
          continue;
        }

        const optMatch = line.match(/^([A-Ea-e])\s*[\.\)\-:]\s*(.+)$/);
        if (optMatch && currentQ) {
          currentQ.options.push(optMatch[2].trim());
          continue;
        }

        const qMatch = line.match(/^(?:soal\s*)?(?:no(?:mor)?\.?\s*)?(\d+)\s*[\.\)\-:]\s*(.+)$/i);
        if (qMatch) {
          if (currentQ && currentQ.options.length >= 2) {
            currentQ._allOptions = [...currentQ.options];
            currentQ.options = currentQ.options.slice(0, targetOptCount);
            while (currentQ.options.length < targetOptCount) {
              currentQ.options.push(`Pilihan ${letters[currentQ.options.length]}`);
            }
            extracted.push(currentQ);
          }
          const qText = qMatch[2].replace(/\s*\*$/, '').trim();
          if (!isIdentityFieldTitle(qText)) {
            currentQ = {
              question: qText,
              options: [],
              correct: 'A',
              entryId: null
            };
          } else {
            currentQ = null;
          }
        } else if (line.endsWith('?') || line.endsWith('...') || line.endsWith('….')) {
          const cleanLine = cleanQuestionNumberPrefix(line.replace(/\s*\*$/, ''));
          if (cleanLine.length > 10 && !isIdentityFieldTitle(cleanLine)) {
            if (currentQ && currentQ.options.length >= 2) {
              currentQ._allOptions = [...currentQ.options];
              currentQ.options = currentQ.options.slice(0, targetOptCount);
              while (currentQ.options.length < targetOptCount) {
                currentQ.options.push(`Pilihan ${letters[currentQ.options.length]}`);
              }
              extracted.push(currentQ);
            }
            currentQ = {
              question: cleanLine,
              options: [],
              correct: 'A',
              entryId: null
            };
          }
        }
      }

      if (currentQ && currentQ.options.length >= 2) {
        currentQ._allOptions = [...currentQ.options];
        currentQ.options = currentQ.options.slice(0, targetOptCount);
        while (currentQ.options.length < targetOptCount) {
          currentQ.options.push(`Pilihan ${letters[currentQ.options.length]}`);
        }
        extracted.push(currentQ);
      }

      return extracted.length > 0 ? { title: '', subject: '', questions: extracted } : null;
    }

    // EKSTRAKTOR OTOMATIS SOAL DARI LINK GOOGLE FORM PUBLIK (FB_PUBLIC_LOAD_DATA_ + DOM + MARKDOWN FALLBACK)
    function parseGoogleFormHtmlToQuestions(htmlText, schoolLevel = 'SMA') {
      if (!htmlText) return null;

      // Deteksi jika Google Form dikunci / wajib login akun Google organisasi
      if (
        !htmlText.includes('FB_PUBLIC_LOAD_DATA_') &&
        (htmlText.includes('accounts.google.com/ServiceLogin') || htmlText.includes('ServiceLogin'))
      ) {
        return { error: 'RESTRICTED_FORM', questions: [] };
      }

      const rawData = extractFbPublicLoadData(htmlText);
      const letters = getOptionLettersByLevel(schoolLevel);
      const targetOptCount = letters.length;

      if (rawData) {
        const formTitle = (rawData?.[1]?.[8] || rawData?.[3] || '').toString().trim();
        const formDesc = (rawData?.[1]?.[0] || '').toString().trim();
        const rawItems = rawData?.[1]?.[1];

        if (Array.isArray(rawItems)) {
          const candidateQuestions = [];
          const allChoiceQuestions = [];
          const nonIdentityTextQuestions = [];

          rawItems.forEach((item) => {
            if (!Array.isArray(item)) return;
            const rawTitle = (item[1] || '').toString().trim();
            const rawDesc = (item[2] || '').toString().trim();
            const qType = item[3];
            const qDetails = item[4];

            // Abaikan Page Break (8), Section Header (6), Image/Video murni tanpa input (9, 10)
            if (!Array.isArray(qDetails) || !Array.isArray(qDetails[0])) return;

            let cleanedQuestionText = cleanQuestionNumberPrefix(rawTitle);
            if ((!cleanedQuestionText || cleanedQuestionText.length < 4) && rawDesc) {
              cleanedQuestionText = cleanQuestionNumberPrefix(rawDesc) || rawDesc;
            } else if (!cleanedQuestionText) {
              cleanedQuestionText = rawTitle || rawDesc || 'Pertanyaan evaluasi sesuai lampiran soal';
            }

            const entryId = qDetails[0][0] ? `entry.${qDetails[0][0]}` : null;
            const rawOpts = qDetails[0][1];
            const isIdentity = isIdentityFieldTitle(rawTitle);

            // Deteksi Soal Menjodohkan (Grid Baris & Kolom pada Google Form: qType === 7)
            if (qType === 7 && qDetails.length >= 2) {
              const extractedPairs = [];
              qDetails.forEach((rowDetail, rIdx) => {
                if (!Array.isArray(rowDetail)) return;
                const leftLabel = String(rowDetail[3]?.[0] || `Pernyataan ${rIdx + 1}`).trim();
                const colChoices = Array.isArray(rowDetail[1]) ? rowDetail[1] : [];
                const rightLabel = String(colChoices[rIdx % Math.max(1, colChoices.length)]?.[0] || `Pasangan ${rIdx + 1}`).trim();
                extractedPairs.push({ left: leftLabel, right: rightLabel });
              });
              if (extractedPairs.length > 0) {
                candidateQuestions.push(normalizeQuestionOptionsForLevel({
                  type: 'matching',
                  question: cleanedQuestionText,
                  pairs: extractedPairs,
                  entryId
                }, schoolLevel));
                return;
              }
            }

            // Jika item memiliki opsi jawaban (Pilihan Ganda, PG Kompleks/Kotak Centang, Benar/Salah, Dropdown)
            if (Array.isArray(rawOpts) && rawOpts.length > 0) {
              const validRawOpts = rawOpts.filter(
                o => Array.isArray(o) && !(o[4] === 1 && (!o[0] || !String(o[0]).trim()))
              );
              const sourceOpts = validRawOpts.length > 0 ? validRawOpts : rawOpts;
              const rawOptLabels = sourceOpts.map(o => (Array.isArray(o) && o[0] != null ? String(o[0]).trim() : ''));

              // Cek apakah soal bertipe Benar / Salah (2 opsi: Benar/Salah atau True/False)
              const isTrueFalseItem =
                sourceOpts.length === 2 &&
                rawOptLabels.every(lbl => /^(benar|salah|true|false|ya|tidak)$/i.test(cleanOptionLetterPrefix(lbl)));

              if (isTrueFalseItem) {
                const tfObj = normalizeQuestionOptionsForLevel({
                  type: 'true_false',
                  question: cleanedQuestionText,
                  correctTF: 'Benar',
                  entryId
                }, schoolLevel);
                allChoiceQuestions.push({ ...tfObj, isIdentity });
                if (!isIdentity) candidateQuestions.push({ ...tfObj, isIdentity });
                return;
              }

              const allFiveOpts = sourceOpts
                .slice(0, 5)
                .map((o, idx) => {
                  const rawOptText = Array.isArray(o) && o[0] !== null && o[0] !== undefined ? String(o[0]).trim() : '';
                  const cleanedOpt = cleanOptionLetterPrefix(rawOptText);
                  return cleanedOpt || `Pilihan ${['A', 'B', 'C', 'D', 'E'][idx] || 'A'}`;
                });

              const opts = allFiveOpts.slice(0, targetOptCount);
              while (opts.length < targetOptCount) {
                opts.push(`Pilihan ${letters[opts.length]}`);
              }

              // qType === 4 pada Google Form adalah Checkboxes (Pilihan Ganda Kompleks)
              const detectedType = qType === 4 ? 'complex_mc' : 'multiple_choice';

              const qObj = normalizeQuestionOptionsForLevel({
                type: detectedType,
                question: cleanedQuestionText,
                options: opts,
                correct: 'A',
                correctComplex: ['A', letters[1] || 'B'],
                entryId,
                _allOptions: allFiveOpts
              }, schoolLevel);

              allChoiceQuestions.push({ ...qObj, isIdentity });
              if (!isIdentity) {
                candidateQuestions.push({ ...qObj, isIdentity });
              }
            } else if (!isIdentity && [0, 1].includes(qType) && cleanedQuestionText.length > 3) {
              // qType === 0 adalah Isian Singkat (Short Answer), qType === 1 adalah Essay / Uraian (Paragraph)
              const textQObj = normalizeQuestionOptionsForLevel({
                type: qType === 0 ? 'short_answer' : 'essay',
                question: cleanedQuestionText,
                correctShort: '',
                correctEssay: '',
                entryId
              }, schoolLevel);
              nonIdentityTextQuestions.push(textQObj);
              candidateQuestions.push(textQObj);
            }
          });

          const finalQuestions =
            candidateQuestions.length > 0
              ? candidateQuestions.map(({ isIdentity, ...rest }) => rest)
              : allChoiceQuestions.length > 0
              ? allChoiceQuestions.map(({ isIdentity, ...rest }) => rest)
              : nonIdentityTextQuestions;

          if (finalQuestions.length > 0) {
            return {
              title: formTitle,
              subject: formDesc ? formDesc.slice(0, 45) : '',
              questions: finalQuestions
            };
          }
        }
      }

      // FALLBACK 2: PARSER DOM HTML
      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const domTitle = (doc.querySelector('meta[property="og:title"]')?.getAttribute('content') || doc.title || '').replace(/- Google Forms$/i, '').trim();
        const listItems = doc.querySelectorAll('[role="listitem"], .Qr7Oae');
        const domExtracted = [];

        listItems.forEach((el) => {
          const headingEl = el.querySelector('[role="heading"], .M7eMe');
          if (!headingEl) return;
          const rawQ = headingEl.textContent.trim().replace(/\*$/, '').trim();
          if (!rawQ || isIdentityFieldTitle(rawQ)) return;

          const optionNodes = el.querySelectorAll('[role="radio"], [role="checkbox"], [role="option"], .aDTYNe, .ulDsOb, .docssharedWizToggleLabeledContent');
          const optTexts = [];
          optionNodes.forEach((node) => {
            const val = (node.getAttribute('data-value') || node.getAttribute('aria-label') || node.textContent || '').trim();
            const cleaned = cleanOptionLetterPrefix(val);
            if (cleaned && cleaned !== 'Pilih' && !optTexts.includes(cleaned)) {
              optTexts.push(cleaned);
            }
          });

          if (optTexts.length >= 2) {
            const trimmedOpts = optTexts.slice(0, targetOptCount);
            while (trimmedOpts.length < targetOptCount) {
              trimmedOpts.push(`Pilihan ${letters[trimmedOpts.length]}`);
            }
            domExtracted.push({
              question: cleanQuestionNumberPrefix(rawQ) || rawQ,
              options: trimmedOpts,
              correct: 'A',
              entryId: null,
              _allOptions: optTexts.slice(0, 5)
            });
          }
        });

        if (domExtracted.length > 0) {
          return { title: domTitle, subject: '', questions: domExtracted };
        }
      } catch (e) {
        // Abaikan jika DOMParser gagal
      }

      // FALLBACK 3: PARSER TEKS / MARKDOWN
      return parsePlainTextOrMarkdownToQuestions(htmlText, schoolLevel);
    }

    // UTILITAS ALARM SUARA ANTI-CURANG (Web Audio API)
    function playCheatAlarm(isLockout = false) {
      if (!state.settings.enable_sound_alarm) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = isLockout ? 'sawtooth' : 'square';
        osc.frequency.setValueAtTime(isLockout ? 880 : 620, ctx.currentTime);
        if (isLockout) {
          osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.35);
        }
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (isLockout ? 0.8 : 0.4));
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + (isLockout ? 0.8 : 0.4));
      } catch (err) {
        // Abaikan jika browser memblokir autoplay audio
      }
    }

    // UTILITAS KONVERSI LINK GOOGLE FORM KE EMBED URL
    function normalizeGoogleFormUrl(url) {
      if (!url) return '';
      let cleanUrl = url.trim();
      if (cleanUrl.includes('viewform') && !cleanUrl.includes('embedded=true')) {
        cleanUrl += (cleanUrl.includes('?') ? '&' : '?') + 'embedded=true';
      }
      return cleanUrl;
    }

    // UTILITAS FORMAT TANGGAL & DURASI
    function formatDateIndo(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      return d.toLocaleDateString('id-ID', {
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      });
    }

    function formatTimeShort(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    function calculateDurationText(startStr, finishStr) {
      if (!startStr) return '-';
      const start = new Date(startStr).getTime();
      const end = finishStr ? new Date(finishStr).getTime() : Date.now();
      const diffMins = Math.max(1, Math.round((end - start) / 60000));
      return `${diffMins} mnt`;
    }

    function calculateIntegrityPercentage(violationCount, maxViolations = 3) {
      const maxV = Math.max(1, maxViolations);
      const ratio = Math.max(0, ((maxV - (violationCount || 0)) / maxV) * 100);
      return Math.round(ratio);
    }

    // UTILITAS KALKULASI PREDIKAT NILAI UJIAN SISWA
    function getScorePredicate(score, status = 'submitted') {
      const num = parseFloat(score) || 0;
      if (status === 'locked') {
        return {
          grade: 'E',
          label: 'E (Diskualifikasi)',
          shortLabel: 'Diskualifikasi',
          badgeClass: 'bg-[#F5B5B5] text-red-950 border-red-300'
        };
      }
      if (num >= 90) {
        return {
          grade: 'A',
          label: 'A (Sangat Baik)',
          shortLabel: 'Sangat Baik',
          badgeClass: 'bg-[#D9F2A7] text-[#0A2E36] border-[#a8d158]'
        };
      }
      if (num >= 80) {
        return {
          grade: 'B',
          label: 'B (Baik)',
          shortLabel: 'Baik',
          badgeClass: 'bg-[#9EDBD3] text-[#0A2E36] border-[#66bfb3]'
        };
      }
      if (num >= 70) {
        return {
          grade: 'C',
          label: 'C (Cukup)',
          shortLabel: 'Cukup',
          badgeClass: 'bg-[#BFC2F4] text-[#0A2E36] border-[#8f94e8]'
        };
      }
      if (num >= 60) {
        return {
          grade: 'D',
          label: 'D (Kurang)',
          shortLabel: 'Kurang',
          badgeClass: 'bg-amber-200 text-amber-950 border-amber-300'
        };
      }
      return {
        grade: 'E',
        label: 'E (Sangat Kurang)',
        shortLabel: 'Sangat Kurang',
        badgeClass: 'bg-[#F5B5B5]/80 text-red-950 border-red-300'
      };
    }

    // UTILITAS TOAST NOTIFIKASI
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        info: 'bg-[#0A2E36] text-white border-white/20',
        success: 'bg-[#D9F2A7] text-[#0A2E36] border-[#0A2E36]/20',
        danger: 'bg-[#F5B5B5] text-[#0A2E36] border-red-900/20',
        warning: 'bg-[#9EDBD3] text-[#0A2E36] border-[#0A2E36]/20'
      };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-2xl border shadow-lg text-xs font-semibold transition-all duration-300 ${colors[type] || colors.info}`;
      toast.innerHTML = `
        <div class="flex items-center gap-2.5">
          <span>${message}</span>
        </div>
        <button class="opacity-70 hover:opacity-100 font-bold text-sm" onclick="this.parentElement.remove()">×</button>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentElement) toast.remove();
      }, 4000);
    }

    // =========================================================================
    // KONEKSI DATA SUPABASE & REAL-TIME SUBSCRIPTION (100% REAL SAAT DEPLOY)
    // =========================================================================
    async function fetchAllData(silent = false) {
      if (IS_PREVIEW) {
        renderApp();
        return;
      }
      if (!silent) {
        state.isLoading = true;
        renderApp();
      }
      try {
        const [classesRes, examsRes, partRes, sessRes, logsRes, setRes] = await Promise.all([
          supabase.from('cbt_classes').select('*').order('class_name', { ascending: true }),
          supabase.from('cbt_exams').select('*').order('created_at', { ascending: false }),
          supabase.from('cbt_participants').select('*').order('created_at', { ascending: false }),
          supabase.from('cbt_sessions').select('*').order('started_at', { ascending: false }),
          supabase.from('cbt_violation_logs').select('*').order('created_at', { ascending: false }).limit(100),
          supabase.from('cbt_settings').select('*').limit(1)
        ]);

        if (classesRes.error) throw classesRes.error;
        if (examsRes.error) throw examsRes.error;
        if (partRes.error) throw partRes.error;
        if (sessRes.error) throw sessRes.error;
        if (logsRes.error) throw logsRes.error;

        state.classes = classesRes.data || [];
        state.exams = examsRes.data || [];
        state.participants = partRes.data || [];
        state.sessions = sessRes.data || [];
        state.violationLogs = logsRes.data || [];
        if (setRes.data && setRes.data.length > 0) {
          state.settings = { ...state.settings, ...setRes.data[0] };
        }
      } catch (err) {
        if (!silent) showToast('Gagal memuat data dari Supabase: ' + err.message, 'danger');
      } finally {
        state.isLoading = false;
        renderApp();
      }
    }

    function initRealtimeSubscription() {
      if (IS_PREVIEW || !supabase || state.realtimeConnected) return;
      try {
        supabase
          .channel('astro-cbt-realtime-channel')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'cbt_classes' }, () => {
            fetchAllData(true);
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'cbt_exams' }, () => {
            fetchAllData(true);
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'cbt_sessions' }, () => {
            fetchAllData(true);
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'cbt_violation_logs' }, () => {
            fetchAllData(true);
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'cbt_participants' }, () => {
            fetchAllData(true);
          })
          .subscribe((status) => {
            if (status === 'SUBSCRIBED') {
              state.realtimeConnected = true;
              renderApp();
            }
          });
      } catch (err) {
        console.error('Realtime subscription error:', err);
      }
    }

    async function saveClassRoom(e, classId = null) {
      e.preventDefault();
      const class_name = document.getElementById('form-class-name').value.trim();
      const grade_level = document.getElementById('form-class-grade').value.trim();
      const homeroom_teacher = document.getElementById('form-class-teacher').value.trim();

      if (!class_name) {
        showToast('Nama Kelas tidak boleh kosong.', 'warning');
        return;
      }

      const payload = { class_name, grade_level, homeroom_teacher };

      if (IS_PREVIEW) {
        if (classId) {
          const oldClass = state.classes.find(c => c.id === classId);
          const oldName = oldClass ? oldClass.class_name : null;
          const idx = state.classes.findIndex(c => c.id === classId);
          if (idx > -1) state.classes[idx] = { ...state.classes[idx], ...payload };

          if (oldName && oldName !== class_name) {
            state.participants.forEach(p => {
              if (p.class_name === oldName) p.class_name = class_name;
            });
            state.exams.forEach(ex => {
              if (ex.target_class === oldName) ex.target_class = class_name;
            });
          }
          showToast('Data kelas berhasil diperbarui (Preview).', 'success');
        } else {
          const exists = state.classes.some(c => c.class_name.toLowerCase() === class_name.toLowerCase());
          if (exists) {
            showToast('Nama kelas tersebut sudah terdaftar.', 'warning');
            return;
          }
          state.classes.push({
            id: 'cls-' + Date.now(),
            ...payload,
            created_at: new Date().toISOString()
          });
          showToast('Kelas baru berhasil ditambahkan (Preview).', 'success');
        }
        closeModal();
        renderApp();
        return;
      }

      try {
        if (classId) {
          const oldClass = state.classes.find(c => c.id === classId);
          const oldName = oldClass ? oldClass.class_name : null;
          const { error } = await supabase.from('cbt_classes').update(payload).eq('id', classId);
          if (error) throw error;

          if (oldName && oldName !== class_name) {
            await Promise.all([
              supabase.from('cbt_participants').update({ class_name }).eq('class_name', oldName),
              supabase.from('cbt_exams').update({ target_class: class_name }).eq('target_class', oldName)
            ]);
          }
          showToast('Data kelas berhasil diperbarui!', 'success');
        } else {
          const { error } = await supabase.from('cbt_classes').insert([payload]);
          if (error) throw error;
          showToast('Kelas baru berhasil disimpan ke database!', 'success');
        }
        closeModal();
        await fetchAllData();
      } catch (err) {
        showToast('Gagal menyimpan kelas: ' + err.message, 'danger');
      }
    }

    async function saveExam(e, examId = null) {
      e.preventDefault();
      const rawUrl = (document.getElementById('form-exam-url')?.value || '').trim();

      // Jika Admin menempel link Google Form asli dan soal masih default/belum terbaca, sinkronkan dulu sebelum menyimpan
      if (
        rawUrl &&
        (rawUrl.includes('docs.google.com/forms') || rawUrl.includes('forms.gle')) &&
        !rawUrl.includes('example_form') &&
        (lastSyncedGFormUrl !== rawUrl || isDefaultBiologyQuestions(modalDraftQuestions))
      ) {
        await fetchQuestionsFromGFormLink(true);
      }

      const title = (document.getElementById('form-exam-title')?.value || '').trim();
      const subject = (document.getElementById('form-exam-subject')?.value || '').trim();
      const school_level = (document.getElementById('form-exam-school-level')?.value || modalDraftLevel || 'SMA').toUpperCase();
      const target_class = (document.getElementById('form-exam-target-class')?.value || '').trim() || 'SEMUA KELAS';
      const gform_url = normalizeGoogleFormUrl(rawUrl);
      const exam_token = (document.getElementById('form-exam-token')?.value || '').trim().toUpperCase();
      const duration_minutes = parseInt(document.getElementById('form-exam-duration')?.value, 10) || 60;
      const max_violations = parseInt(document.getElementById('form-exam-violations')?.value, 10) || 3;
      const is_active = document.getElementById('form-exam-active') ? document.getElementById('form-exam-active').checked : true;

      const collectedQuestions = collectQuestionsFromExamModal();
      const total_questions = collectedQuestions.length || parseInt(document.getElementById('form-exam-total-questions')?.value, 10) || 5;
      const questions_data = collectedQuestions.length > 0 ? collectedQuestions : buildDefaultQuestionsList(total_questions, school_level);

      const basePayload = { title, subject, target_class, gform_url, exam_token, duration_minutes, max_violations, is_active };
      const fullPayload = { ...basePayload, school_level, total_questions, questions_data };
      const optionRangeLabel = school_level === 'SMP' ? 'Opsi A–D' : 'Opsi A–E';

      if (IS_PREVIEW) {
        if (examId) {
          const idx = state.exams.findIndex(x => x.id === examId);
          if (idx > -1) state.exams[idx] = { ...state.exams[idx], ...fullPayload };
          saveExamQuestionsCache(examId, questions_data, total_questions, school_level);
          showToast(`Data ujian ${school_level} (${optionRangeLabel}) berhasil diperbarui (Preview).`, 'success');
        } else {
          const newId = 'ex-' + Date.now();
          state.exams.unshift({
            id: newId,
            ...fullPayload,
            created_at: new Date().toISOString()
          });
          saveExamQuestionsCache(newId, questions_data, total_questions, school_level);
          showToast(`Ujian ${school_level} (${total_questions} soal • ${optionRangeLabel}) untuk ${target_class} berhasil ditambahkan!`, 'success');
        }
        closeModal();
        renderApp();
        return;
      }

      try {
        if (examId) {
          let { error } = await supabase.from('cbt_exams').update(fullPayload).eq('id', examId);
          if (error) {
            const fallbackRes = await supabase.from('cbt_exams').update(basePayload).eq('id', examId);
            if (fallbackRes.error) throw fallbackRes.error;
          }
          saveExamQuestionsCache(examId, questions_data, total_questions, school_level);
          showToast(`Jadwal ujian ${school_level} (${optionRangeLabel}) berhasil diperbarui!`, 'success');
        } else {
          let { data, error } = await supabase.from('cbt_exams').insert([fullPayload]).select().single();
          if (error) {
            const fallbackRes = await supabase.from('cbt_exams').insert([basePayload]).select().single();
            if (fallbackRes.error) throw fallbackRes.error;
            data = fallbackRes.data;
          }
          if (data && data.id) {
            saveExamQuestionsCache(data.id, questions_data, total_questions, school_level);
          }
          showToast(`Ujian ${school_level} (${optionRangeLabel} • ${target_class}) berhasil disimpan!`, 'success');
        }
        closeModal();
        await fetchAllData();
      } catch (err) {
        showToast('Gagal menyimpan ujian: ' + err.message, 'danger');
      }
    }

    // SIMPAN NILAI UJIAN & CATATAN HASIL SISWA (PADA MENU HASIL & LAPORAN)
    async function saveSessionScore(e, sessionId) {
      e.preventDefault();
      const rawScoreVal = parseFloat(document.getElementById('form-session-score').value) || 0;
      const scoreVal = Number.isInteger(rawScoreVal) ? rawScoreVal : parseFloat(rawScoreVal.toFixed(2));
      const notesVal = document.getElementById('form-session-notes').value.trim();
      const statusVal = document.getElementById('form-session-status').value;

      if (IS_PREVIEW) {
        const sess = state.sessions.find(s => s.id === sessionId);
        if (sess) {
          sess.score = scoreVal;
          sess.notes = notesVal;
          sess.status = statusVal;
          if (statusVal === 'submitted' && !sess.finished_at) {
            sess.finished_at = new Date().toISOString();
          }
        }
        closeModal();
        showToast(`Nilai ujian (${scoreVal}) berhasil diperbarui secara akurat!`, 'success');
        renderApp();
        return;
      }

      try {
        const updatePayload = {
          score: scoreVal,
          notes: notesVal,
          status: statusVal
        };
        if (statusVal === 'submitted') {
          updatePayload.finished_at = new Date().toISOString();
        }
        const { error } = await supabase
          .from('cbt_sessions')
          .update(updatePayload)
          .eq('id', sessionId);
        if (error) throw error;
        closeModal();
        showToast(`Nilai (${scoreVal}) & laporan hasil siswa berhasil disimpan ke Supabase!`, 'success');
        await fetchAllData();
      } catch (err) {
        showToast('Gagal menyimpan nilai: ' + err.message, 'danger');
      }
    }

    async function unlockSession(sessionId) {
      if (IS_PREVIEW) {
        const sess = state.sessions.find(s => s.id === sessionId);
        if (sess) {
          sess.status = 'working';
          sess.violation_count = 0;
          const part = state.participants.find(p => p.id === sess.participant_id);
          if (part) part.is_locked = false;
        }
        showToast('Kunci sesi dibuka & skor pelanggaran di-reset menjadi 0.', 'success');
        renderApp();
        return;
      }

      try {
        const sess = state.sessions.find(s => s.id === sessionId);
        const { error } = await supabase
          .from('cbt_sessions')
          .update({ status: 'working', violation_count: 0 })
          .eq('id', sessionId);
        if (error) throw error;

        if (sess) {
          await supabase.from('cbt_participants').update({ is_locked: false }).eq('id', sess.participant_id);
        }
        showToast('Sesi peserta berhasil dibuka kembali!', 'success');
        await fetchAllData();
      } catch (err) {
        showToast('Gagal membuka kunci sesi: ' + err.message, 'danger');
      }
    }

        renderApp();

      try {
        const { error } = await supabase.from('cbt_sessions').update({ status: 'locked' }).eq('id', sessionId);

        showToast('Sesi peserta berhasil dikunci.', 'warning');
        await fetchAllData();

        showToast('Gagal mengunci sesi: ' + err.message, 'danger');

    // =========================================================================
    // MESIN ANTI-CURANG, AUTO-GRADING & RUANG UJIAN PESERTA
    // =========================================================================
    function requestExamFullscreenSync() {
      state.isFullscreenActive = true;
      const appRoot = document.getElementById('astro-cbt-root');
      if (appRoot) {
        appRoot.classList.add('exam-fullscreen-mode');
      }
      const previewBanner = document.getElementById('preview-banner');
      if (previewBanner) {
        previewBanner.classList.add('hidden');
      }

      try {
        const docEl = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (docEl.requestFullscreen) {
            const p = docEl.requestFullscreen();
            if (p && typeof p.then === 'function') {
              p.then(() => {
                state.nativeFullscreenEntered = true;
                state.isFullscreenActive = true;
              }).catch(() => {
                state.isFullscreenActive = true;
              });
            }
          } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
            state.nativeFullscreenEntered = true;
          }
        } else {
          state.nativeFullscreenEntered = true;
        }
      } catch (err) {
        state.isFullscreenActive = true;
      }
    }

    async function verifyAndStartExam(e, examId) {
      e.preventDefault();
      const inputToken = document.getElementById('verify-token-input').value.trim().toUpperCase();
      const agreed = document.getElementById('verify-pact-check').checked;
      const exam = state.exams.find(x => x.id === examId);

      if (!exam) return;

      if (!isExamMatchingClass(exam.target_class, state.currentUser.class_name)) {
        showToast(`Ujian ini khusus untuk kelas ${exam.target_class}, sedangkan Anda di kelas ${state.currentUser.class_name}.`, 'danger');
        return;
      }

      if (!agreed) {
        showToast('Anda wajib menyetujui Pakta Integritas sebelum memulai ujian.', 'warning');
        return;
      }
      if (inputToken !== exam.exam_token.toUpperCase()) {
        showToast('Token Ujian tidak valid! Periksa kembali token dari Pengawas.', 'danger');
        return;
      }

      // Jika ujian memiliki link Google Form asli namun soalnya masih default placeholder, tarik soal otomatis sebelum ruang ujian dibuka
      if (
        exam.gform_url &&
        (exam.gform_url.includes('docs.google.com/forms') || exam.gform_url.includes('forms.gle')) &&
        !exam.gform_url.includes('example_form') &&
        isDefaultBiologyQuestions(getExamQuestionsList(exam), exam.title)
      ) {
        showToast('Sedang memuat soal dari Link Google Form...', 'info');
        const examLevel = getExamSchoolLevel(exam);
        const synced = await fetchAndParseGoogleFormUrl(exam.gform_url, examLevel);
        if (synced && Array.isArray(synced.questions) && synced.questions.length > 0) {
          exam.questions_data = synced.questions;
          exam.total_questions = synced.questions.length;
          saveExamQuestionsCache(exam.id, synced.questions, synced.questions.length, examLevel);
        }
      }

      let existingSession = state.sessions.find(
        s => s.exam_id === exam.id && s.participant_id === state.currentUser.id
      );

      if (existingSession && existingSession.status === 'locked') {
        showToast('Sesi ujian Anda terkunci karena melebihi batas pelanggaran. Hubungi Pengawas.', 'danger');
        return;
      }
      if (existingSession && existingSession.status === 'submitted') {
        showToast('Anda sudah menyelesaikan ujian ini.', 'info');
        return;
      }

      requestExamFullscreenSync();

      if (IS_PREVIEW) {
        if (!existingSession) {
          existingSession = {
            id: 'ss-' + Date.now(),
            exam_id: exam.id,
            participant_id: state.currentUser.id,
            status: 'working',
            violation_count: 0,
            score: 0,
            notes: '',
            started_at: new Date().toISOString(),
            finished_at: null
          };
          state.sessions.unshift(existingSession);
        }
        closeModal();
        launchLockedExamRoom(exam, existingSession);
        return;
      }

      try {
        if (!existingSession) {
          const { data, error } = await supabase
            .from('cbt_sessions')
            .insert([{
              exam_id: exam.id,
              participant_id: state.currentUser.id,
              status: 'working',
              violation_count: 0,
              score: 0,
              notes: '',
              started_at: new Date().toISOString()
            }])
            .select()
            .single();
          if (error) throw error;
          existingSession = data;
          state.sessions.unshift(data);
        }
        closeModal();
        launchLockedExamRoom(exam, existingSession);
      } catch (err) {
        showToast('Gagal memulai sesi ujian: ' + err.message, 'danger');
      }
    }

    function launchLockedExamRoom(exam, session) {
      state.activeExamData = exam;
      state.activeExamSession = session;
      state.remainingSeconds = (exam.duration_minutes || 60) * 60;
      state.isFullscreenActive = true;

      requestExamFullscreenSync();
      startExamCountdown();
      renderApp();
    }

    function startExamCountdown() {
      if (state.timerInterval) clearInterval(state.timerInterval);
      state.timerInterval = setInterval(() => {
        if (!state.activeExamSession || state.activeExamSession.status === 'locked') {
          clearInterval(state.timerInterval);
          return;
        }
        state.remainingSeconds--;
        const timerEl = document.getElementById('exam-live-timer');
        if (timerEl) {
          const mins = Math.floor(Math.max(0, state.remainingSeconds) / 60).toString().padStart(2, '0');
          const secs = (Math.max(0, state.remainingSeconds) % 60).toString().padStart(2, '0');
          timerEl.textContent = `${mins}:${secs}`;
        }
        if (state.remainingSeconds <= 0) {
          clearInterval(state.timerInterval);
          finishExamSession(true);
        }
      }, 1000);
    }

    function enterExamFullscreen() {
      requestExamFullscreenSync();
      showToast('Mode Layar Penuh diaktifkan.', 'info');
    }

    async function recordCheatViolation(violationType = 'Terdeteksi Aktivitas Mencurigakan') {
      if (!state.activeExamSession || !state.activeExamData) return;
      if (state.activeExamSession.status !== 'working') return;

      const now = Date.now();
      if (now - state.lastViolationTimestamp < 1500) return;
      state.lastViolationTimestamp = now;

      const exam = state.activeExamData;
      const session = state.activeExamSession;
      session.violation_count = (session.violation_count || 0) + 1;

      const isOverLimit = session.violation_count >= (exam.max_violations || 3);
      if (isOverLimit) {
        session.status = 'locked';
        if (state.currentUser) state.currentUser.is_locked = true;
      }

      playCheatAlarm(isOverLimit);

      const newLog = {
        id: 'vl-' + Date.now(),
        session_id: session.id,
        participant_name: state.currentUser?.full_name || 'Peserta',
        exam_title: exam.title,
        violation_type: violationType,
        created_at: new Date().toISOString()
      };
      state.violationLogs.unshift(newLog);

      if (!IS_PREVIEW && supabase) {
        try {
          await Promise.all([
            supabase
              .from('cbt_sessions')
              .update({
                violation_count: session.violation_count,
                status: session.status
              })
              .eq('id', session.id),
            supabase
              .from('cbt_violation_logs')
              .insert([{
                session_id: session.id,
                participant_name: newLog.participant_name,
                exam_title: newLog.exam_title,
                violation_type: newLog.violation_type
              }])
          ]);
          if (isOverLimit && state.currentUser?.id) {
            await supabase
              .from('cbt_participants')
              .update({ is_locked: true })
              .eq('id', state.currentUser.id);
          }
        } catch (err) {
          console.error('Failed logging violation:', err);
        }
      }

      if (isOverLimit) {
        showToast(`BATAS PELANGGARAN TERCAPAI (${session.violation_count}/${exam.max_violations})! Ujian Anda dikunci otomatis.`, 'danger');
      } else {
        showToast(`PERINGATAN ANTI-CURANG (${session.violation_count}/${exam.max_violations}): ${violationType}`, 'warning');
      }

      renderApp();
    }

    async function finishExamSession(isAutoTimeout = false) {
      if (!state.activeExamSession || !state.activeExamData) return;

      try {
        const iframe = document.getElementById('cbt-exam-iframe');
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage({ type: 'CBT_REQUEST_GRADE_SYNC' }, '*');
          try {
            if (typeof iframe.contentWindow.computeAndSendGrade === 'function') {
              const gradeResult = iframe.contentWindow.computeAndSendGrade(false);
              if (gradeResult && typeof gradeResult.score === 'number') {
                state.activeExamSession.score = gradeResult.score;
                state.activeExamSession.notes = gradeResult.notes || state.activeExamSession.notes;
              }
            }
          } catch (crossOriginErr) {
            // Abaikan jika iframe berbeda origin
          }
        }
      } catch (e) {
        // Abaikan error akses iframe
      }

      await new Promise(r => setTimeout(r, 120));

      const session = state.activeExamSession;
      session.status = 'submitted';
      session.finished_at = new Date().toISOString();

      clearInterval(state.timerInterval);

      if (!IS_PREVIEW && supabase) {
        try {
          await supabase
            .from('cbt_sessions')
            .update({
              status: 'submitted',
              score: session.score ?? 0,
              notes: session.notes || '',
              finished_at: session.finished_at
            })
            .eq('id', session.id);
        } catch (err) {
          console.error('Error updating finished session:', err);
        }
      }

      const finalScore = session.score ?? 0;
      state.activeExamSession = null;
      state.activeExamData = null;
      state.nativeFullscreenEntered = false;

      const appRoot = document.getElementById('astro-cbt-root');
      if (appRoot) appRoot.classList.remove('exam-fullscreen-mode');
      if (IS_PREVIEW) {
        const previewBanner = document.getElementById('preview-banner');
        if (previewBanner) previewBanner.classList.remove('hidden');
      }
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }

      showToast(
        isAutoTimeout
          ? `Waktu habis! Ujian otomatis diselesaikan. Nilai Anda: ${finalScore}`
          : `Ujian selesai! Nilai Anda tercatat otomatis: ${finalScore}`,
        'success'
      );

      renderApp();
    }

    // Listener pesan nilai otomatis dari iframe lembar soal Google Form
    window.addEventListener('message', async (event) => {
      const data = event.data;
      if (!data || data.type !== 'CBT_GFORM_SCORE_UPDATE') return;
      if (!state.activeExamSession) return;

      const totalQ = Math.max(1, parseInt(data.totalQuestions, 10) || state.activeExamData?.total_questions || 5);
      const correctCount = Math.min(totalQ, Math.max(0, parseInt(data.correctCount, 10) || 0));
      const wrongCount = Math.max(0, totalQ - correctCount);
      const pointPerQ = Number((100 / totalQ).toFixed(2));
      const exactScore = calculateExactExamScore(correctCount, totalQ);

      state.activeExamSession.score = exactScore;
      state.activeExamSession.notes = `Benar ${correctCount} dari ${totalQ} soal (Salah ${wrongCount} nomor) • Poin/soal: ${pointPerQ}`;

      if (!IS_PREVIEW && supabase && state.activeExamSession.id) {
        try {
          await supabase
            .from('cbt_sessions')
            .update({
              score: exactScore,
              notes: state.activeExamSession.notes
            })
            .eq('id', state.activeExamSession.id);
        } catch (err) {
          // Abaikan gangguan jaringan sementara
        }
      }

      if (data.isFinalSubmit) {
        showToast(`Jawaban terekam! Benar ${correctCount}/${totalQ} soal — Nilai: ${exactScore}`, 'success');
      }
    });

    // Listener Anti-Curang Global (Pindah Tab, Blur Jendela, Keluar Fullscreen, Klik Kanan)
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && state.activeExamSession && state.activeExamSession.status === 'working') {
        recordCheatViolation('Pindah Tab / Menyembunyikan Jendela Browser');
      }
    });

    window.addEventListener('blur', () => {
      if (state.activeExamSession && state.activeExamSession.status === 'working') {
        const activeEl = document.activeElement;
        if (activeEl && activeEl.tagName === 'IFRAME') return;
        recordCheatViolation('Kehilangan Fokus Jendela Ujian');
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (state.activeExamSession && state.activeExamSession.status === 'working') {
        if (state.nativeFullscreenEntered && !document.fullscreenElement) {
          recordCheatViolation('Keluar dari Mode Layar Penuh (Fullscreen)');
        }
      }
    });

    document.addEventListener('contextmenu', (e) => {
      if (state.activeExamSession) {
        e.preventDefault();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (!state.activeExamSession || state.activeExamSession.status !== 'working') return;
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
        (e.ctrlKey && ['U', 'S', 'P'].includes(e.key.toUpperCase()))
      ) {
        e.preventDefault();
        recordCheatViolation(`Percobaan Pintasan Keyboard Terlarang (${e.key})`);
      }
    });
